name: Publication system integration

on:
  push:
    branches: [integration/scientific-publication-20260907]
    paths:
      - '.publication-import/**'
      - '.github/workflows/publication-import-20260907.yml'
      - 'scripts/publication_bundle.py'
      - 'tests/test_publication_integration.py'

permissions:
  contents: write

concurrency:
  group: publication-import-20260907
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'Thomas-Heisig/Brain-5D'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Materialize complete publication
        run: git lfs pull --include='research/publications/**' --exclude=''
      - name: Integrate publication into research system
        run: |
          python .publication-import/integrate.py
          python scripts/publication_bundle.py --build-reader
          python scripts/publication_bundle.py
      - name: Install and validate code
        run: |
          python -m pip install -e '.[dev,docs]'
          python -m black scripts/publication_bundle.py tests/test_publication_integration.py
          python -m ruff check scripts/publication_bundle.py tests/test_publication_integration.py
          python -m pytest tests/test_publication_integration.py tests/test_dashboard_file_manager.py -q
      - name: Commit derived reader and additive system integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/publications/reader research/README.md README.md .pre-commit-config.yaml src/dashboard/research_source.py src/dashboard/file_rendering.py scripts/publication_bundle.py tests/test_publication_integration.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat(research): expose frozen publication and complete chapter reader in research system'
            git push origin HEAD:refs/heads/integration/scientific-publication-20260907
          fi
