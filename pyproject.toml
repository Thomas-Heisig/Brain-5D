[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain5d-core"
version = "0.5.0a5"
description = "Sparse 5D spiking-neural simulation with observable plasticity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Thomas Heisig" },
]
keywords = [
  "spiking-neural-networks",
  "STDP",
  "structural-plasticity",
  "homeostasis",
  "neuromorphic",
  "simulation",
  "5D",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Inspired Computing",
]
dependencies = [
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/Thomas-Heisig/Brain-5D"
Repository = "https://github.com/Thomas-Heisig/Brain-5D"
Documentation = "https://github.com/Thomas-Heisig/Brain-5D#readme"
Changelog = "https://github.com/Thomas-Heisig/Brain-5D/blob/main/CHANGELOG.md"
Issues = "https://github.com/Thomas-Heisig/Brain-5D/issues"

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "mypy>=1.10",
  "pylint>=3.2",
  "pyright>=1.1.400",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5.0",
  "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: tests that take >5 s (skipped in fast CI)",
  "integration: tests that require real I/O or external files",
  "smoke: quick import/config sanity checks",
  "storage: b5d / journal / checkpoint persistence tests",
  "plasticity: STDP / structural plasticity tests",
  "dashboard: dashboard HTTP / bridge tests",
  "embodiment: embodiment / agent / environment tests",
  "learning: reward / eligibility / learning-engine tests",
  "homeostasis: homeostatic regulation tests",
  "core: neuron / network / synapse core tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/**/__init__.py", "src/main.py", "src/visualization/observatory.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
  "src/core/",
  "src/config/",
  "src/diagnostics/",
  "src/telemetry/",
  "src/utils/",
  "src/main.py",
  "src/visualization/observatory.py",
  "tests/",
]

[tool.pylint.main]
py-version = "3.13"
ignore-paths = ["^tests/"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 8
max-attributes = 20

[tool.pylint.messages_control]
disable = [
  "duplicate-code",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",              # isort
]
ignore = [
  "E501",    # line length handled by black
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "ARG001", "ARG002"]
"scripts/*" = ["S101", "S311", "ARG001"]
