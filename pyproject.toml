[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain5d-core"
version = "0.1.0"
description = "Verified observable sparse 5D spiking-neural simulation core (Sprint 1C reference)."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
