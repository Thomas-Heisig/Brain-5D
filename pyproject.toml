[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhrn-core"
version = "0.6.0a1"
description = "Multi-scale homeostatic recurrent spiking-neural research architecture."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Thomas Heisig" },
]
keywords = [
  "spiking-neural-networks",
  "STDP",
  "structural-plasticity",
  "homeostasis",
  "neuromorphic",
  "simulation",
  "recurrent-networks",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Inspired Computing",
]
dependencies = [
  "defusedxml>=0.7.1",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/Thomas-Heisig/Brain-5D"
Repository = "https://github.com/Thomas-Heisig/Brain-5D"
Documentation = "https://github.com/Thomas-Heisig/Brain-5D#readme"
Changelog = "https://github.com/Thomas-Heisig/Brain-5D/blob/main/CHANGELOG.md"
Issues = "https://github.com/Thomas-Heisig/Brain-5D/issues"

[project.optional-dependencies]
analysis = [
  "scikit-learn>=1.5",
  "umap-learn>=0.5",
]
docs = [
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "pypdf>=6.0.0",
]
browser = [
  "playwright>=1.55.0",
]
dev = [
  "black==26.5.1",
  "mypy==2.3.1",
  "pylint==4.0.8",
  "pyright==1.1.411",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff==0.16.6",
  "types-defusedxml>=0.7.0",
  "types-PyYAML>=6.0",
  "types-psutil>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: tests that take >5 s (skipped in fast CI)",
  "integration: tests that require real I/O or external files",
  "smoke: quick import/config sanity checks",
  "storage: b5d / journal / checkpoint persistence tests",
  "plasticity: STDP / structural plasticity tests",
  "dashboard: dashboard HTTP / bridge tests",
  "embodiment: embodiment / agent / environment tests",
  "learning: reward / eligibility / learning-engine tests",
  "homeostasis: homeostatic regulation tests",
  "core: neuron / network / synapse core tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/**/__init__.py", "src/main.py", "src/visualization/observatory.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
  "src/core/",
  "src/config/",
  "src/diagnostics/",
  "src/telemetry/",
  "src/utils/",
  "src/main.py",
  "src/visualization/observatory.py",
  "tests/",
]

[tool.pylint.main]
py-version = "3.13"
ignore-paths = ["^tests/"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 8
max-attributes = 20

[tool.pylint.messages_control]
disable = [
  "duplicate-code",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",              # isort
]
ignore = [
  "E501",    # line length handled by black
]

[tool.bandit]
targets = ["src/"]
exclude_dirs = ["tests", "scripts", "configs"]
skips = ["B101", "B301", "B403", "B404", "B603", "B607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "ARG001", "ARG002"]
"scripts/*" = ["S101", "S311", "ARG001"]

# src is the import namespace, not an implicit src-layout directory.
[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.setuptools.package-data]
"src.dashboard" = ["static/*", "static/**/*"]
