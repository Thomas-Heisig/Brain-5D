seed: 42

dimensions: [10, 10, 10, 10, 10]
initial_neurons: 5000
max_neurons: 100000

simulation:
  dt_ms: 1.0
  ticks: 2000
  max_delay: 20
  debug_invariants: false

neuron:
  a: 0.02
  b: 0.2
  c: -65.0
  d: 8.0

network:
  initial_connections_per_neuron: 10
  neighbour_radius: 2.0
  weight_min: 0.0
  weight_max: 0.5

energy:
  initial: 1.0
  spike_cost: 0.001
  affects_firing: false

topology:
  input:
    dimension: x
    coordinate: 0
  output:
    dimension: x
    coordinate: 9
  allow_self_connections: false
  allow_parallel_connections: false

diagnostics:
  mode: single_neuron_drive
  start_tick: 100
  duration_ticks: 20
  amplitude: 10.0
  target_coord: [0, 4, 7, 3, 2]
  input_plane_dim: x
  poisson_rate_hz: 0.5
  poisson_amplitude: 5.0

telemetry:
  enabled: true
  history_ticks: 5000
  spike_history_ticks: 5000

visualization:
  enabled: false
  refresh_interval_ticks: 20
  spike_raster_neurons: 250
  projection_4d: d4
  activity_tau_ticks: 50.0

logging:
  interval_ticks: 100
