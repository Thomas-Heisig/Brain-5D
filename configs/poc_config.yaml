seed: 42

dimensions: [10, 10, 10, 10, 10]
initial_neurons: 5000
max_neurons: 100000

simulation:
  dt_ms: 1.0
  ticks: 2000
  max_delay: 20
  debug_invariants: false

neuron:
  a: 0.02
  b: 0.2
  c: -65.0
  d: 8.0

network:
  initial_connections_per_neuron: 10
  neighbour_radius: 2.0
  weight_min: 0.0
  weight_max: 0.5

energy:
  initial: 1.0
  spike_cost: 0.001
  affects_firing: false

topology:
  input:
    dimension: x
    coordinate: 0
  output:
    dimension: x
    coordinate: 9
  allow_self_connections: false
  allow_parallel_connections: false

diagnostics:
  mode: single_neuron_drive
  start_tick: 100
  duration_ticks: 20
  amplitude: 10.0
  target_coord: [0, 4, 7, 3, 2]
  input_plane_dim: x
  poisson_rate_hz: 0.5
  poisson_amplitude: 5.0

telemetry:
  enabled: true
  history_ticks: 5000
  spike_history_ticks: 5000

visualization:
  enabled: false
  refresh_interval_ticks: 20
  spike_raster_neurons: 250
  projection_4d: d4
  activity_tau_ticks: 50.0
  show_heatmap: true
  heatmap_type: activity

logging:
  interval_ticks: 100

stdp:
  enabled: false
  a_plus: 0.1
  a_minus: 0.12
  tau_plus: 20.0
  tau_minus: 20.0
  max_weight: 1.0
  min_weight: 0.0

eligibility:
  enabled: true
  tau_ticks: 200.0

reward:
  enabled: false
  learning_rate: 0.01
  delay_ticks: 0
  clamp_weights: true
  reset_trace_after_reward: false
  trace_epsilon: 1.0e-12
  reward_source: external

# Structural adaptation stays opt-in. This mirrors configs/self_organization.yaml
# so the main PoC exposes every available subsystem in one place.
self_organization:
  enabled: false
  interval_ticks: 100
  pruning_enabled: false
  pruning_weight_threshold: 0.005
  pruning_min_age_ticks: 1000
  sprouting_enabled: false
  sprouting_max_out_degree: 12
  sprouting_radius: 2.0
  sprouting_weight: 0.05
  sprouting_delay: 1
  neurogenesis_enabled: false
  neurogenesis_spike_delta_threshold: 50
  neurogenesis_radius: 1.0
  neurogenesis_max_per_cycle: 1

# .b5d V1 is provided as a storage API in this update. It is intentionally not
# auto-saved by src.main yet; explicit snapshots avoid hidden I/O costs.
storage:
  enabled: false
  format: b5d
  path: artifacts/brain5d_snapshot.b5d
  restart_capable: true
  journal:
    enabled: false
    path: artifacts/brain5d_snapshot.b5d.journal
    crc: true
    fsync_on_commit: true
    commit_interval_ticks: 10
    max_payload_size: 1048576
  runtime:
    enabled: false
    capture_spike_events: true
    capture_policy: full_change_scan
  lazy_observatory:
    enabled: false
    heatmap_type: activity
    activity_tau_ticks: 50.0
