<section class="control-card" id="runtime-control-card" aria-labelledby="runtime-control-title">
  <div class="control-card__header">
    <div>
      <h2 id="runtime-control-title">Runtime Control</h2>
      <p>Ticks, loops, pacing, snapshots and structural gates.</p>
    </div>
    <span class="runtime-state" id="runtime-state">unknown</span>
  </div>

  <div class="runtime-metrics">
    <div><span>Tick</span><strong id="runtime-tick">0</strong></div>
    <div><span>Queued</span><strong id="runtime-queued">0</strong></div>
    <div><span>Batch</span><strong id="runtime-last-batch">0</strong></div>
    <div><span>Batch ms</span><strong id="runtime-last-ms">0.0</strong></div>
  </div>

  <div class="control-grid">
    <label>
      Ticks
      <input id="step-ticks" type="number" min="1" max="10000000" value="1" />
    </label>
    <button id="step-button" type="button">Step</button>

    <label>
      Loop size
      <input id="loop-size" type="number" min="1" max="1000000" value="100" />
    </label>
    <button id="run-button" type="button">Run</button>

    <label>
      Delay / tick (ms)
      <input id="delay-ms" type="number" min="0" max="60000" step="0.1" value="0" />
    </label>
    <button id="apply-runtime-config" type="button">Apply</button>

    <button id="pause-button" type="button">Pause</button>
    <button id="snapshot-button" type="button">Snapshot</button>
    <button id="stop-button" class="danger" type="button">Stop</button>
  </div>

  <div class="self-org-controls">
    <h3>Self-Organization Gate</h3>
    <label class="switch-line">
      <input id="self-org-enabled" type="checkbox" checked />
      Policy enabled
    </label>
    <label class="switch-line">
      <input id="self-org-dry-run" type="checkbox" checked />
      Dry-run (recommended)
    </label>
    <div class="proposal-line">
      <span>Last proposal</span>
      <strong id="self-org-proposal">none</strong>
    </div>
  </div>

  <output id="control-message" class="control-message" aria-live="polite"></output>
</section>
