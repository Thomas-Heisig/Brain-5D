<section class="card operator-console" id="operator-console">
  <h2>Operator Console</h2>
  <div class="operator-grid">
    <button id="b5d-step">+1 Tick</button>
    <input id="b5d-tick-count" type="number" min="1" value="100" aria-label="Tick count">
    <button id="b5d-run-ticks">Run N Ticks</button>
    <button id="b5d-start">Start Loop</button>
    <button id="b5d-pause">Pause</button>
    <button id="b5d-resume">Resume</button>
    <button id="b5d-stop">Stop</button>
    <button id="b5d-snapshot">Snapshot</button>
    <button id="b5d-undo">Undo Structural Change</button>
  </div>
  <p class="operator-note">Structural proposals remain approval-gated. No autonomous mutation is enabled by this panel.</p>
  <div id="operator-status"></div>
  <div id="self-org-proposals"></div>
</section>
