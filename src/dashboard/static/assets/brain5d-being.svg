<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
  <title id="title">Brain-5D symmetrical living system organism</title>
  <desc id="description">A bilateral organism with paired sensory inputs, a central neural database and paired actionable extremities.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#f7f6d4" stop-opacity=".98"/>
      <stop offset=".24" stop-color="#5de4d0" stop-opacity=".9"/>
      <stop offset=".66" stop-color="#247b9b" stop-opacity=".72"/>
      <stop offset="1" stop-color="#061923" stop-opacity=".18"/>
    </radialGradient>
    <radialGradient id="sense" cx="42%" cy="38%" r="65%">
      <stop offset="0" stop-color="#fffbd2"/>
      <stop offset=".18" stop-color="#7ff4dc"/>
      <stop offset=".62" stop-color="#2e9eb7" stop-opacity=".86"/>
      <stop offset="1" stop-color="#112b42" stop-opacity=".2"/>
    </radialGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#75f4d9"/>
      <stop offset=".52" stop-color="#e4b35f"/>
      <stop offset="1" stop-color="#e87558"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="bodyClip"><ellipse cx="500" cy="284" rx="190" ry="132"/></clipPath>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g class="sensory-branches" stroke="#67e5d1" stroke-width="4" opacity=".72">
      <path d="M320 260C245 214 184 203 116 228M320 302C239 300 178 326 112 370"/>
      <path d="M680 260C755 214 816 203 884 228M680 302C761 300 822 326 888 370"/>
    </g>
    <g class="antennae" stroke="#e3b65f" stroke-width="4" opacity=".8">
      <path d="M434 166C397 107 354 75 305 67M566 166C603 107 646 75 695 67"/>
      <circle cx="305" cy="67" r="7" fill="#f7d98c" stroke="none"/><circle cx="695" cy="67" r="7" fill="#f7d98c" stroke="none"/>
    </g>
    <g class="extremities" stroke="url(#limb)" filter="url(#glow)">
      <path d="M360 370C309 417 268 472 232 535M640 370C691 417 732 472 768 535" stroke-width="24" opacity=".68"/>
      <path d="M420 398C397 459 391 508 398 565M580 398C603 459 609 508 602 565" stroke-width="25" opacity=".68"/>
      <path d="M360 370C309 417 268 472 232 535M640 370C691 417 732 472 768 535M420 398C397 459 391 508 398 565M580 398C603 459 609 508 602 565" stroke-width="3"/>
      <path d="M214 535h36M750 535h36M379 568h38M583 568h38" stroke-width="8"/>
    </g>
    <ellipse class="body-aura" cx="500" cy="284" rx="198" ry="140" fill="url(#core)" stroke="#8af5df" stroke-width="2" filter="url(#glow)"/>
    <g clip-path="url(#bodyClip)" opacity=".84">
      <g stroke-width="1.4">
        <path d="M320 285L381 215 451 333 500 190 549 333 619 215 680 285" stroke="#d9b76b"/>
        <path d="M332 343L410 238 500 366 590 238 668 343" stroke="#65e5d3"/>
        <path d="M365 190L421 371M445 170L477 390M555 170L523 390M635 190L579 371" stroke="#f0eee0" opacity=".52"/>
      </g>
      <g class="neurons" fill="#fffbd8" filter="url(#soft)">
        <circle cx="381" cy="215" r="6"/><circle cx="451" cy="333" r="7"/><circle cx="500" cy="190" r="6"/><circle cx="549" cy="333" r="7"/><circle cx="619" cy="215" r="6"/>
        <circle cx="410" cy="238" r="5"/><circle cx="500" cy="366" r="7"/><circle cx="590" cy="238" r="5"/>
      </g>
    </g>
    <g class="paired-senses" filter="url(#glow)">
      <g>
        <circle cx="170" cy="226" r="42" fill="url(#sense)" stroke="#8af5df" stroke-width="3"/><circle cx="170" cy="226" r="16" stroke="#fffbd8" stroke-width="3"/>
        <circle cx="830" cy="226" r="42" fill="url(#sense)" stroke="#8af5df" stroke-width="3"/><circle cx="830" cy="226" r="16" stroke="#fffbd8" stroke-width="3"/>
      </g>
      <g>
        <circle cx="150" cy="370" r="31" fill="url(#sense)" stroke="#8af5df" stroke-width="2"/><circle cx="150" cy="370" r="9" fill="#fffbd8" stroke="none"/>
        <circle cx="850" cy="370" r="31" fill="url(#sense)" stroke="#8af5df" stroke-width="2"/><circle cx="850" cy="370" r="9" fill="#fffbd8" stroke="none"/>
      </g>
    </g>
    <g class="signal-points" fill="#fffbd8" stroke="none" filter="url(#glow)">
      <circle cx="255" cy="250" r="4"/><circle cx="312" cy="270" r="4"/><circle cx="374" cy="287" r="4"/><circle cx="438" cy="300" r="4"/>
      <circle cx="745" cy="250" r="4"/><circle cx="688" cy="270" r="4"/><circle cx="626" cy="287" r="4"/><circle cx="562" cy="300" r="4"/>
    </g>
    <path class="symmetry-axis" d="M500 115V442" stroke="#fffbd8" stroke-width="1" stroke-dasharray="4 9" opacity=".3"/>
  </g>
  <style>
    .body-aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.8s ease-in-out infinite; }
    .paired-senses { transform-box: fill-box; transform-origin: center; animation: sense 5.4s ease-in-out infinite; }
    .extremities { animation: reach 4.2s ease-in-out infinite alternate; }
    .neurons circle, .signal-points circle { animation: fire 1.8s ease-in-out infinite; }
    .neurons circle:nth-child(3n), .signal-points circle:nth-child(3n) { animation-delay: -.6s; }
    .neurons circle:nth-child(3n+1), .signal-points circle:nth-child(3n+1) { animation-delay: -1.2s; }
    @keyframes breathe { 50% { transform: scale(1.025); opacity: .92; } }
    @keyframes sense { 50% { transform: scale(1.018); opacity: .84; } }
    @keyframes reach { to { opacity: .74; } }
    @keyframes fire { 0%, 100% { opacity: .3; } 45% { opacity: 1; } 60% { opacity: .48; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</svg>
