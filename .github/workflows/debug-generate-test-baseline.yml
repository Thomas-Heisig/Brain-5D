name: Generate PR test baseline artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Generate honest source-bound baseline
        run: python scripts/generate_baseline.py
      - name: Upload generated baseline
        uses: actions/upload-artifact@v4
        with:
          name: generated-test-baseline
          path: tests/test_baseline.json
          if-no-files-found: error
