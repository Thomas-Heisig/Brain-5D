name: MHRN Naming Migration

on:
  push:
    branches: ['migration/mhrn-20260908']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration:
    if: github.ref == 'refs/heads/migration/mhrn-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install verification tools and platform client
        run: python -m pip install -e '.[dev,docs]' build huggingface_hub
      - name: Materialize names and verify compatibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: python .maintenance/mhrn_ci.py
