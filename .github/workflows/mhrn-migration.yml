name: MHRN Naming Migration

on:
  push:
    branches: ['migration/mhrn-20260908']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration:
    if: github.ref == 'refs/heads/migration/mhrn-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install verification tools
        run: python -m pip install -e '.[dev,docs]' build
      - name: Refine naming and preserve actual platform boundaries
        run: python .maintenance/mhrn_prepare.py
      - name: Verify compatibility and record actual results
        run: python .maintenance/mhrn_ci.py
      - name: Retain browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mhrn-browser-verification
          path: test-results/
          retention-days: 7
