name: Refresh final integration baseline

on:
  push:
    branches:
      - fix/final-integration-20260911
    paths:
      - .github/integration/baseline-trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Generate exact source-bound baseline
        run: |
          python -m black --check src tests scripts
          python -m ruff check src tests scripts
          python scripts/generate_baseline.py
          python scripts/check_doc_consistency.py --check-tests
          python scripts/check_connectome_integrity.py
      - name: Preserve historical scientific records
        run: |
          git diff --exit-code "$GITHUB_SHA" -- research/experiments research/registry/evidence research/publications
      - name: Commit generated verification and remove one-shot workflow
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f .github/integration/baseline-trigger .github/workflows/refresh-final-integration-baseline.yml
          git add tests/test_baseline.json research/generated/verification .github/integration/baseline-trigger .github/workflows/refresh-final-integration-baseline.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: refresh genuinely executed source-bound verification"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Export verification diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/baseline-verification"
          cp tests/test_baseline.json "$RUNNER_TEMP/baseline-verification/test-baseline.json"
          git rev-parse HEAD > "$RUNNER_TEMP/baseline-verification/HEAD.txt"
          git status --porcelain > "$RUNNER_TEMP/baseline-verification/status.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-source-bound-baseline
          path: ${{ runner.temp }}/baseline-verification/
          retention-days: 7
