name: Repository source snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repository-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Export verification wheels
        run: |
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/wheelhouse" black mypy pylint pyright ruff types-PyYAML types-psutil build setuptools wheel bandit
      - name: Export versioned sources and history without credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/source-snapshot"
          git bundle create "$RUNNER_TEMP/source-snapshot/repository.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/source-snapshot/HEAD.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: verification-wheels
          path: ${{ runner.temp }}/wheelhouse/
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: repository-source-${{ github.sha }}
          path: ${{ runner.temp }}/source-snapshot/
          retention-days: 3
