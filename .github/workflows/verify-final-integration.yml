name: Verify final integration

on:
  push:
    branches:
      - fix/final-integration-20260911
    paths:
      - .github/integration/verify-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install full development environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Formatting and lint
        run: |
          python -m black --check src tests scripts
          python -m ruff check src tests scripts
      - name: Type checks
        run: |
          python -m mypy src
          python -m pyright src
      - name: Full Python test suite and exact baseline
        run: python scripts/generate_baseline.py
      - name: Scientific and documentation integrity
        run: |
          python scripts/check_doc_consistency.py --check-tests
          python scripts/check_connectome_integrity.py
          python scripts/generate_catalog_audit_report.py
          python research/generate_reports.py
          git diff --exit-code -- research/experiments research/registry/evidence research/publications
      - name: Browser static smoke
        run: python scripts/browser_check.py
      - name: Commit genuinely executed verification and remove one-shot workflow
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f .github/integration/verify-trigger .github/workflows/verify-final-integration.yml
          git add tests/test_baseline.json research/generated .github/integration/verify-trigger .github/workflows/verify-final-integration.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No generated verification changes to commit"
          else
            git commit -m "test: refresh source-bound verification"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
