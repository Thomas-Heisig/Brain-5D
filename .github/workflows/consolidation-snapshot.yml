name: Consolidation source snapshot

on:
  push:
    branches: [main]
    paths: [.github/workflows/consolidation-snapshot.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export current source and all branch history without credentials
        run: |
          mkdir -p "$RUNNER_TEMP/consolidation-source"
          git bundle create "$RUNNER_TEMP/consolidation-source/repository.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/consolidation-source/HEAD.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: consolidation-source
          path: ${{ runner.temp }}/consolidation-source/
          retention-days: 3
