name: Publication Revision

on:
  push:
    branches: [main, 'revision/publication-critique-*']
    paths:
      - 'research/publications/**'
      - 'scripts/publication_revision.py'
      - 'tests/test_publication_revision.py'
      - '.github/workflows/publication-revision.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify unchanged original publication
        run: python scripts/publication_bundle.py
      - name: Verify current edition and run methodological witnesses
        run: python scripts/publication_revision.py --export "$RUNNER_TEMP/Brain5D_Abhandlung_v1.1.md"
      - name: Install project test tools
        if: always()
        run: python -m pip install -e '.[dev,docs]'
      - name: Edition and integration regression tests
        if: always()
        run: python -m pytest tests/test_publication_revision.py tests/test_publication_integration.py -q
      - name: Check code format and lint
        if: always()
        run: |
          python -m black --check --diff scripts/publication_revision.py tests/test_publication_revision.py research/publications/2026-09-07_ki-die-geliehene-intelligenz_v1.1/methodenpruefung.py
          python -m ruff check scripts/publication_revision.py tests/test_publication_revision.py research/publications/2026-09-07_ki-die-geliehene-intelligenz_v1.1/methodenpruefung.py
      - name: Verification must not rewrite sources
        if: always()
        run: git diff --exit-code -- research/publications scripts/publication_revision.py tests/test_publication_revision.py
