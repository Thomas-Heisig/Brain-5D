name: Block Invalid SNN Stability Runner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Apply guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/dashboard/experiment_workflow.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if question_id in {"RQ-SNN-001", "RQ-SNN-002"}:\n            return "run_ping"\n'''
          new = '''        if question_id == "RQ-SNN-001":\n            raise WorkflowValidationError(\n                "RQ-SNN-001 requires a dedicated long-term stability protocol with sustained activity; "\n                "run_ping is not valid primary evidence for this research question."\n            )\n        if question_id == "RQ-SNN-002":\n            return "run_ping"\n'''
          if old not in text:
              raise SystemExit('SNN runner mapping target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_scientific_execution_contract.py')
          text = tests.read_text(encoding='utf-8')
          if 'test_long_term_stability_question_rejects_ping_runner' not in text:
              text += '''\n\ndef test_long_term_stability_question_rejects_ping_runner() -> None:\n    import pytest\n    from src.dashboard.experiment_workflow import WorkflowValidationError\n\n    with pytest.raises(WorkflowValidationError, match="dedicated long-term stability protocol"):\n        ExperimentWorkflowService._science_runner(\n            {"protocol": "science_suite_v1"}, _workflow("RQ-SNN-001")\n        )\n\n\ndef test_reproducibility_question_keeps_ping_runner() -> None:\n    assert (\n        ExperimentWorkflowService._science_runner(\n            {"protocol": "science_suite_v1"}, _workflow("RQ-SNN-002")\n        )\n        == "run_ping"\n    )\n'''
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m pip install -e ".[dev]"
          python -m black src/dashboard/experiment_workflow.py tests/test_scientific_execution_contract.py
          python -m ruff check src/dashboard/experiment_workflow.py tests/test_scientific_execution_contract.py
          python -m pytest -q tests/test_scientific_execution_contract.py
          python -m mypy src/dashboard/experiment_workflow.py
          python -m pyright src/dashboard/experiment_workflow.py tests/test_scientific_execution_contract.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/experiment_workflow.py tests/test_scientific_execution_contract.py
          git commit -m "fix: block invalid ping evidence for long-term stability"
          git push origin HEAD:main
