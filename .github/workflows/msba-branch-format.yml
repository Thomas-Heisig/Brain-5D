name: MSBA Branch Format

on:
  push:
    branches:
      - codex/msba-experiment-runner

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/msba-experiment-runner
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned formatter
        run: python -m pip install black==26.5.1
      - name: Fix narrow typing contract and format changed Python files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/embodiment/peripheral_adapters.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "def declaration_artifact_hash(value: JSONValue) -> str:",
              "def declaration_artifact_hash(value: object) -> str:",
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m black \
            src/embodiment/peripheral_adapters.py \
            src/experiments/msba_lab.py \
            src/research/followup_experiments.py \
            tests/test_msba_experiment_runner.py
      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/embodiment/peripheral_adapters.py src/experiments/msba_lab.py src/research/followup_experiments.py tests/test_msba_experiment_runner.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(msba): apply pinned CI formatter"
          git push origin HEAD:codex/msba-experiment-runner
