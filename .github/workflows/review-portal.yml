name: External review portal
on:
  pull_request:
    branches: [main]
    paths: ['review_portal/**', 'src/dashboard/static/review/**', 'src/dashboard/static/dashboard-shell.js', 'research/external_review/**', 'src/dashboard/external_review.py', 'src/dashboard/static/external-review.js', '.github/workflows/review-portal.yml']
  push:
    branches: [main, 'feature/external-review-portal-*']
    paths: ['review_portal/**', 'src/dashboard/static/review/**', 'src/dashboard/static/dashboard-shell.js', 'research/external_review/**', 'src/dashboard/external_review.py', 'src/dashboard/static/external-review.js', '.github/workflows/review-portal.yml']
  workflow_dispatch:
    inputs:
      publish_pages:
        description: 'Publish the static/export-only portal (Pages must already be configured for Actions)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install isolated review and test dependencies
        run: python -m pip install -r review_portal/requirements.txt pytest httpx playwright
      - name: Verify generated catalogue and Python syntax
        run: |
          python -m review_portal.build --check
          python -m compileall -q review_portal
      - name: API, consent, privacy and statistics tests
        run: python -m pytest review_portal/tests/test_portal.py -q
      - name: JavaScript contract tests
        run: |
          node --check src/dashboard/static/review/app.js
          node --check src/dashboard/static/review/admin.js
          node --test review_portal/tests/model.test.mjs
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser checks on desktop and mobile
        run: python -m review_portal.tests.browser_smoke
      - name: Upload synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: review-portal-synthetic-screenshots
          path: review-portal-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
  publish-static:
    needs: verify
    if: github.ref == 'refs/heads/main' && (inputs.publish_pages == true || vars.MHRN_REVIEW_PAGES_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: review-portal-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: src/dashboard/static/review
      - name: Publish questionnaire ONLY, never response data or the runtime
        id: deployment
        uses: actions/deploy-pages@v4
