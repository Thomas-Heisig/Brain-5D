name: Run AIRR-2026-0001 follow-up experiments

on:
  push:
    branches: [research/airr-0001-experiment-results]
    paths:
      - ".github/workflows/run-airr-0001-followups.yml"

permissions:
  contents: write

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: research/airr-0001-experiment-results
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Retry previously failed registered protocols
        run: |
          python -m src.research.workflow_recovery EXP-BATCH-20260906200118 \
            --research-root research \
            --batch-id EXP-RETRY-AIRR-2026-0001 \
            > research/EXP-RETRY-AIRR-2026-0001.execution.json
      - name: Run drive-response follow-up
        run: |
          mkdir -p research/experiments/EXP-SNN-DRIVE-NEXT
          python -m src.research.stability_followups drive-response \
            --config configs/learning_experiment.yaml \
            --ticks 20000 \
            --seeds 101-103 \
            --output research/experiments/EXP-SNN-DRIVE-NEXT/results.json
      - name: Run stimulus-class follow-up
        run: |
          mkdir -p research/experiments/EXP-SNN-STIMULUS-NEXT
          python -m src.research.stability_followups stimulus-class \
            --config configs/learning_experiment.yaml \
            --ticks 20000 \
            --seeds 101-103 \
            --output research/experiments/EXP-SNN-STIMULUS-NEXT/results.json
      - name: Run parameter-robustness follow-up
        run: |
          mkdir -p research/experiments/EXP-SNN-ROBUST-NEXT
          python -m src.research.stability_followups parameter-robustness \
            --config configs/learning_experiment.yaml \
            --ticks 20000 \
            --seeds 101-103 \
            --output research/experiments/EXP-SNN-ROBUST-NEXT/results.json
      - name: Commit experiment outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/
          git diff --cached --quiet && exit 0
          git commit -m "research: execute AIRR-2026-0001 follow-up experiments"
          git push origin HEAD:research/airr-0001-experiment-results
