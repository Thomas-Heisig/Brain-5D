name: CI Main Type Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-main-type-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Narrow semantic digest container types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/dashboard/experiment_workflow.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if isinstance(value, tuple):\n            digest.update(b"tuple\\0")\n            for item in value:\n                update_value(item)\n                digest.update(b"\\0")\n            return\n        if isinstance(value, frozenset):\n            digest.update(b"frozenset\\0")\n            encoded_items = sorted(\n                f"{type(item).__qualname__}:{item!r}".encode(\n                    "utf-8", errors="backslashreplace"\n                )\n                for item in value\n            )\n'''
          new = '''        if isinstance(value, tuple):\n            digest.update(b"tuple\\0")\n            tuple_items = cast(tuple[object, ...], value)\n            for item in tuple_items:\n                update_value(item)\n                digest.update(b"\\0")\n            return\n        if isinstance(value, frozenset):\n            digest.update(b"frozenset\\0")\n            set_items = cast(frozenset[object], value)\n            encoded_items = sorted(\n                f"{type(item).__qualname__}:{item!r}".encode(\n                    "utf-8", errors="backslashreplace"\n                )\n                for item in set_items\n            )\n'''
          if old not in text:
              raise SystemExit('semantic digest type-narrowing anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/ci-main-type-cleanup-once.yml').unlink()
          PY
      - name: Verify typing and focused regressions
        shell: bash
        run: |
          python -m pip install -e ".[dev,docs]" pre-commit
          python -m black src/dashboard/experiment_workflow.py
          python -m ruff check --fix src/dashboard/experiment_workflow.py
          python -m mypy src/
          python -m pyright
          python -m pytest -q tests/test_dashboard_experiment_workflow.py tests/test_scientific_execution_contract.py tests/test_exp21_operational_protocols.py tests/test_research_data_v2.py
          python -m pre_commit run --all-files --show-diff-on-failure
      - name: Commit cleanup to main
        shell: bash
        run: |
          git config user.name "Thomas Heisig"
          git config user.email "t_heisig@gmx.de"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "ci: type semantic source-freeze digest explicitly"
          git push origin HEAD:main
