name: One-shot batch and CI repair

on:
  push:
    branches:
      - fix/batch-20260910-ci-gates

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,docs]'
      - name: Apply reviewed repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected patch context not found: {path}')
              if text.count(old) != 1:
                  raise SystemExit(f'patch context not unique: {path} ({text.count(old)})')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Mypy: dynamic dataclass lifecycle updates are validated by SensorActivationService;
          # cast only the kwargs expansion, keeping ConnectionDescriptor as the result type.
          replace_once(
              'src/embodiment/connections.py',
              'from typing import cast\n',
              'from typing import Any, cast\n',
          )
          replace_once(
              'src/embodiment/connections.py',
              '            updated = replace(current, **changes)\n',
              '            updated = replace(current, **cast(Any, changes))\n',
          )

          # Decoder tuples must never escape as an actuator command when no behavior profile exists.
          replace_once(
              'src/experience/engine.py',
              '''        action = (\n            self.behavior_profile.select_action(decoded, tick=tick)\n            if self.behavior_profile is not None and isinstance(decoded, tuple)\n            else decoded\n        )\n''',
              '''        if isinstance(decoded, tuple):\n            action: ActionCommand | None = (\n                self.behavior_profile.select_action(decoded, tick=tick)\n                if self.behavior_profile is not None\n                else (decoded[0] if decoded else None)\n            )\n        else:\n            action = decoded\n''',
          )

          # ResearchAssistant must mirror ResearchRegistry fragment semantics.
          replace_once(
              'src/research_assistant/assistant.py',
              '''        questions = self._read_yaml("registry/questions.yaml")\n        hypotheses = self._read_yaml("registry/hypotheses.yaml")\n        claims = self._read_yaml("registry/claims.yaml")\n''',
              '''        questions = self._read_yaml_family("registry/questions.yaml")\n        hypotheses = self._read_yaml_family("registry/hypotheses.yaml")\n        claims = self._read_yaml_family("registry/claims.yaml")\n''',
          )
          replace_once(
              'src/research_assistant/assistant.py',
              '''            sources = self._read_yaml("registry/sources.yaml")\n''',
              '''            sources = self._read_yaml_family(\n                "registry/sources.yaml", identity_key="source_id"\n            )\n''',
          )
          marker = '''    def _safe_path(self, relative_path: str) -> Path:\n'''
          family = '''    def _read_yaml_family(\n        self, relative_path: str, *, identity_key: str = "id"\n    ) -> list[dict[str, Any]]:\n        """Read a canonical YAML registry plus its same-stem fragment files."""\n        base = self._safe_path(relative_path)\n        paths = [base, *sorted(base.parent.glob(f"{base.stem}.*{base.suffix}"))]\n        records: list[dict[str, Any]] = []\n        seen: set[str] = set()\n        for path in paths:\n            raw_data: Any = yaml.safe_load(path.read_text(encoding="utf-8"))\n            if raw_data is None:\n                continue\n            if not isinstance(raw_data, list):\n                raise ValueError(f"Research registry fragment must be a list: {path.name}")\n            for value in cast(list[object], raw_data):\n                if not isinstance(value, dict):\n                    continue\n                item = cast(dict[str, Any], value)\n                identifier = item.get(identity_key)\n                if isinstance(identifier, str):\n                    if identifier in seen:\n                        raise ValueError(\n                            f"Duplicate research registry identifier {identifier}: {path.name}"\n                        )\n                    seen.add(identifier)\n                records.append(item)\n        return records\n\n'''
          replace_once('src/research_assistant/assistant.py', marker, family + marker)

          # Catalog distinguishes visible research questions from runnable workflow items.
          replace_once(
              'src/research/catalog_status.py',
              'from .cognition_governance import PREFIXES\n',
              'from .cognition_governance import PREFIXES\nfrom .connectome_governance import PROTECTED_QUESTIONS\n',
          )
          replace_once(
              'src/research/catalog_status.py',
              '''    for question in registry.questions.values():\n        progress = counts[question.id]\n        state = "not_run"\n''',
              '''    for question in registry.questions.values():\n        progress = counts[question.id]\n        is_operational = question.id in operational\n        blocked_design = not is_operational and (\n            question.id.startswith(PREFIXES) or question.id in PROTECTED_QUESTIONS\n        )\n        state = "not_run"\n''',
          )
          replace_once(
              'src/research/catalog_status.py',
              '''                "operational": question.id in operational,\n                "execution_status": (\n                    "BLOCKED_ADAPTER_AND_REVIEW_REQUIRED"\n                    if question.id.startswith(PREFIXES)\n                    else "existing_workflow_contract"\n                ),\n''',
              '''                "operational": is_operational,\n                "workflow_selectable": not blocked_design,\n                "execution_status": (\n                    "BLOCKED_ADAPTER_AND_REVIEW_REQUIRED"\n                    if blocked_design\n                    else "existing_workflow_contract"\n                ),\n''',
          )

          # Batch UI keeps blocked designs visible but disabled instead of auto-running generic ticks.
          replace_once(
              'src/dashboard/static/experiment-workflow-base.js',
              '''        label.classList.add("workflow-batch-protocol-exploratory");\n        label.innerHTML = `<input type="checkbox" value="${escapeHtml(selection)}" checked><span><strong>${escapeHtml(question.id)} · ${escapeHtml(question.label || "")}</strong><small>EXPLORATORY · Runtime-Ticks${hypothesis ? ` · ${escapeHtml(hypothesis.id)}` : " · ohne registrierte Hypothese"} · automatische Diagnosevorgaben</small><em><span>Seeds</span><input type="text" data-batch-seeds value="42-44" readonly><span>Ticks</span><input type="number" data-batch-ticks min="1" value="1000" readonly></em></span>`;\n''',
              '''        label.classList.add("workflow-batch-protocol-exploratory");\n        const selectable = question.workflow_selectable !== false;\n        if (!selectable) label.classList.add("workflow-batch-protocol-blocked");\n        const executionLabel = selectable\n          ? `EXPLORATORY · Runtime-Ticks${hypothesis ? ` · ${escapeHtml(hypothesis.id)}` : " · ohne registrierte Hypothese"} · automatische Diagnosevorgaben`\n          : `BLOCKED · ${escapeHtml(question.execution_status || "native adapter/review required")} · kein Generic-Ticks-Fallback`;\n        label.innerHTML = `<input type="checkbox" value="${escapeHtml(selection)}" ${selectable ? "checked" : "disabled"}><span><strong>${escapeHtml(question.id)} · ${escapeHtml(question.label || "")}</strong><small>${executionLabel}</small><em><span>Seeds</span><input type="text" data-batch-seeds value="42-44" readonly><span>Ticks</span><input type="number" data-batch-ticks min="1" value="1000" readonly></em></span>`;\n''',
          )

          # Direct API submissions retain fail-closed guards but report intentional blocks separately.
          replace_once(
              'src/dashboard/experiment_workflow.py',
              '''            except Exception as exc:\n                results.append(\n                    {\n                        "protocol": protocol_id,\n                        "ticks": child_ticks,\n                        "seeds": child_seeds,\n                        "experiment_id": experiment_id,\n                        "status": "failed",\n                        "error": f"{type(exc).__name__}: {exc}",\n                    }\n                )\n''',
              '''            except WorkflowValidationError as exc:\n                message = str(exc)\n                intentionally_blocked = message.startswith(\n                    (\n                        "COGNITION_ADAPTER_NOT_VALIDATED:",\n                        "CONNECTOME_ADAPTER_NOT_VALIDATED:",\n                    )\n                )\n                results.append(\n                    {\n                        "protocol": protocol_id,\n                        "ticks": child_ticks,\n                        "seeds": child_seeds,\n                        "experiment_id": experiment_id,\n                        "status": "blocked" if intentionally_blocked else "failed",\n                        "error": f"{type(exc).__name__}: {exc}",\n                    }\n                )\n            except Exception as exc:\n                results.append(\n                    {\n                        "protocol": protocol_id,\n                        "ticks": child_ticks,\n                        "seeds": child_seeds,\n                        "experiment_id": experiment_id,\n                        "status": "failed",\n                        "error": f"{type(exc).__name__}: {exc}",\n                    }\n                )\n''',
          )
          replace_once(
              'src/dashboard/experiment_workflow.py',
              '''        completed = sum(item["status"] == "completed" for item in results)\n        failed = len(results) - completed\n        report = {\n''',
              '''        completed = sum(item["status"] == "completed" for item in results)\n        blocked = sum(item["status"] == "blocked" for item in results)\n        failed = sum(item["status"] == "failed" for item in results)\n        report = {\n''',
          )
          replace_once(
              'src/dashboard/experiment_workflow.py',
              '''            "completed": completed,\n            "failed": failed,\n            "results": results,\n''',
              '''            "completed": completed,\n            "blocked": blocked,\n            "failed": failed,\n            "results": results,\n''',
          )
          # There are two completed/failed return/report contexts; patch the remaining return one.
          workflow_text = Path('src/dashboard/experiment_workflow.py').read_text(encoding='utf-8')
          old_return = '''            "completed": completed,\n            "failed": failed,\n            "results": results,\n        }\n\n    def run_science'''
          new_return = '''            "completed": completed,\n            "blocked": blocked,\n            "failed": failed,\n            "results": results,\n        }\n\n    def run_science'''
          if old_return in workflow_text:
              Path('src/dashboard/experiment_workflow.py').write_text(workflow_text.replace(old_return, new_return, 1), encoding='utf-8')
          replace_once(
              'src/dashboard/experiment_workflow.py',
              '''                    f"- Completed: `{completed}`",\n                    f"- Failed: `{failed}`",\n''',
              '''                    f"- Completed: `{completed}`",\n                    f"- Blocked by design: `{blocked}`",\n                    f"- Failed: `{failed}`",\n''',
          )

          # Manifest durability: atomic write + fsync, then verify visibility before returning.
          replace_once(
              'src/research/experiment_recorder.py',
              'import json\nimport platform\n',
              'import json\nimport os\nimport platform\nimport tempfile\n',
          )
          replace_once(
              'src/research/experiment_recorder.py',
              '''    def save(self) -> Path:\n        """Write the manifest to disk as JSON."""\n        manifest_path = self.output_dir / "manifest.json"\n        with open(manifest_path, "w", encoding="utf-8") as f:\n            json.dump(self._manifest, f, indent=2, ensure_ascii=False)\n        return manifest_path\n''',
              '''    def save(self) -> Path:\n        """Atomically persist the manifest and fail if it is not immediately readable."""\n        manifest_path = self.output_dir / "manifest.json"\n        payload = (\n            json.dumps(self._manifest, indent=2, ensure_ascii=False) + "\\n"\n        ).encode("utf-8")\n        fd, temporary = tempfile.mkstemp(\n            prefix=".manifest.", suffix=".json.tmp", dir=str(self.output_dir)\n        )\n        try:\n            with os.fdopen(fd, "wb") as stream:\n                stream.write(payload)\n                stream.flush()\n                os.fsync(stream.fileno())\n            os.replace(temporary, manifest_path)\n        finally:\n            if os.path.exists(temporary):\n                os.unlink(temporary)\n        if not manifest_path.is_file():\n            raise FileNotFoundError(f"Manifest persistence failed: {manifest_path}")\n        return manifest_path\n''',
          )

          # Statistics should not silently discard newly introduced scalar metrics.
          path = Path('src/research/experiment_summary.py')
          text = path.read_text(encoding='utf-8')
          needle = '''    conditions: dict[str, Any] = {}\n    for condition, condition_runs in sorted(by_condition.items()):\n'''
          replacement = '''    discovered_numeric_metrics = {\n        str(name)\n        for run in runs\n        for name, value in (run.get("metrics") or {}).items()\n        if _number(value) is not None\n    }\n    numeric_metric_names = tuple(sorted(set(numeric_metric_names) | discovered_numeric_metrics))\n\n    conditions: dict[str, Any] = {}\n    for condition, condition_runs in sorted(by_condition.items()):\n'''
          if needle not in text:
              raise SystemExit('statistics patch context missing')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          # Browser contract changed intentionally from read-only display to experiment-only controls.
          replace_once(
              'tests/browser/fullstack.spec.js',
              "  await expect(page.locator('#wesen-neural-symbiosis')).toContainText('READ-ONLY');\n",
              "  await expect(page.locator('#wesen-neural-symbiosis')).toContainText('EXPERIMENT CONTROL');\n  await expect(page.locator('#wesen-neural-symbiosis')).toContainText('Productive Gateway: LOCKED');\n",
          )

          # Regression tests for registry fragments and decoder tuple fallback.
          extra = Path('tests/test_batch_20260910_regressions.py')
          extra.write_text('''from pathlib import Path\n\nimport pytest\n\nfrom src.research_assistant.assistant import ResearchAssistant\n\n\ndef test_research_assistant_reads_registry_fragments_and_rejects_duplicates(tmp_path: Path) -> None:\n    root = tmp_path / "research"\n    registry = root / "registry"\n    registry.mkdir(parents=True)\n    (registry / "questions.yaml").write_text("- id: RQ-BASE\\n  question: base\\n", encoding="utf-8")\n    (registry / "questions.extra.yaml").write_text("- id: RQ-FRAGMENT\\n  question: fragment\\n", encoding="utf-8")\n    assistant = ResearchAssistant(root)\n    rows = assistant._read_yaml_family("registry/questions.yaml")\n    assert [row["id"] for row in rows] == ["RQ-BASE", "RQ-FRAGMENT"]\n    (registry / "questions.duplicate.yaml").write_text("- id: RQ-BASE\\n  question: duplicate\\n", encoding="utf-8")\n    with pytest.raises(ValueError, match="Duplicate research registry identifier RQ-BASE"):\n        assistant._read_yaml_family("registry/questions.yaml")\n''', encoding='utf-8')
          PY
      - name: Format and verify targeted repairs
        run: |
          python -m black src tests scripts
          python -m mypy src/
          python -m pytest tests/test_memory_layer.py tests/test_catalog_status.py tests/test_scientific_execution_contract.py tests/test_connectome_embodiment.py tests/test_cognition_program.py tests/test_batch_20260910_regressions.py -q
      - name: Commit code repairs before source freeze
        run: |
          git config user.name 'MHRN CI Repair'
          git config user.email 'mhrn-ci-repair@users.noreply.github.com'
          git rm .github/workflows/fix-batch-20260910.yml
          git add -A
          git commit -m 'fix: harden batch execution and restore CI contracts'
      - name: Regenerate clean full-suite baseline
        run: python scripts/generate_baseline.py
      - name: Commit verified baseline and push
        run: |
          git add tests/test_baseline.json research/generated/verification || true
          git commit -m 'test: refresh verified source baseline' || true
          git push origin HEAD:fix/batch-20260910-ci-gates
