name: TODO Finalizer v2
on:
  push:
    branches:
      - codex/complete-open-todos
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python .maintenance/complete_open_todos.py
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Validate focused contracts
        run: |
          python -m black src/dashboard/file_rendering.py tests/test_file_rendering.py
          python -m ruff check src/dashboard/file_rendering.py tests/test_file_rendering.py
          python -m pytest tests/test_file_rendering.py -q
          node --check src/dashboard/static/file-renderer.js
          node --check src/dashboard/static/bibtex-viewer.js
          git diff --check
      - name: Commit final tree
        run: |
          rm -f .github/workflows/todo-fullstack-finalize.yml .github/workflows/todo-finalize-v2.yml .maintenance/complete_open_todos.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(viewer): complete executable full-stack TODO backlog'
          git push origin HEAD:codex/complete-open-todos
