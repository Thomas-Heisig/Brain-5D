name: Publication import 2026-09-07

on:
  push:
    branches: [integration/scientific-publication-20260907]
    paths:
      - '.publication-import/**'
      - '.github/workflows/publication-import-20260907.yml'

permissions:
  contents: write

concurrency:
  group: publication-import-20260907
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'Thomas-Heisig/Brain-5D'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Materialize original source documents
        run: git lfs pull --include='docs/06-research/*.docx' --exclude=''
      - name: Restore all publication files with byte-exact checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .publication-import/assemble.py
      - name: Commit verified publication using Git LFS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/publications
          git commit -m 'docs(research): restore 41 verified publication files and complete original archive'
          git push origin HEAD:refs/heads/integration/scientific-publication-20260907
          echo "Publication commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
