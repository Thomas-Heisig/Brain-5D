name: Repair Experiment Summary Typing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Repair scoped metric variable
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/research/experiment_summary.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for run in runs:\n        metrics_value = run.get("metrics")\n        metrics: dict[str, Any] = (\n            dict(metrics_value) if isinstance(metrics_value, dict) else {}\n        )\n        lines.append(\n            "| "\n            + " | ".join(\n                [\n                    _fmt(run.get("seed")),\n                    _fmt(run.get("condition")),\n                    _fmt(metrics.get("ticks_executed", metrics.get("ticks"))),\n                    _fmt(metrics.get("total_spikes")),\n                    _fmt(metrics.get("delivered_synaptic_events")),\n                    _fmt(metrics.get("activated_neurons")),\n                    _fmt(metrics.get("recurrent_events")),\n                    _fmt(metrics.get("propagation_depth")),\n                    _fmt(run.get("runtime_error")),\n                ]\n            )\n            + " |"\n        )\n'''
          new = '''    for run in runs:\n        metrics_value = run.get("metrics")\n        run_metrics: dict[str, Any] = (\n            dict(metrics_value) if isinstance(metrics_value, dict) else {}\n        )\n        lines.append(\n            "| "\n            + " | ".join(\n                [\n                    _fmt(run.get("seed")),\n                    _fmt(run.get("condition")),\n                    _fmt(\n                        run_metrics.get(\n                            "ticks_executed", run_metrics.get("ticks")\n                        )\n                    ),\n                    _fmt(run_metrics.get("total_spikes")),\n                    _fmt(run_metrics.get("delivered_synaptic_events")),\n                    _fmt(run_metrics.get("activated_neurons")),\n                    _fmt(run_metrics.get("recurrent_events")),\n                    _fmt(run_metrics.get("propagation_depth")),\n                    _fmt(run.get("runtime_error")),\n                ]\n            )\n            + " |"\n        )\n'''
          if old not in text:
              raise SystemExit('typing patch target not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Format
        run: |
          python -m pip install black
          python -m black src/research/experiment_summary.py
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research/experiment_summary.py
          git commit -m "fix: resolve experiment summary typing"
          git push origin HEAD:main
