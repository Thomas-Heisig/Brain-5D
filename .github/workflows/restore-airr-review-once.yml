name: Restore AIRR Review Helpers Once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-airr-review-once.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Restore canonical review helpers
        env:
          AIRR_REVIEW_TAIL_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          p = Path('src/research_assistant/airr.py')
          text = p.read_text(encoding='utf-8')
          marker = '\ndef write_human_review(\n'
          head, sep, _tail = text.partition(marker)
          if not sep:
              raise SystemExit('write_human_review marker missing')
          tail = base64.b64decode(os.environ['AIRR_REVIEW_TAIL_B64']).decode('utf-8')
          p.write_text(head + '\n' + tail, encoding='utf-8')
          PY
      - name: Validate restored AIRR boundary
        run: |
          python -m pip install -e '.[dev,docs]'
          python -m black --check src/research_assistant/airr.py
          python -m ruff check src/research_assistant/airr.py
          python -m pytest -q tests/test_ai_governance.py tests/test_ai_boundaries.py tests/test_experiment_validity.py tests/test_scientific_execution_contract.py
          python -m mypy src/research_assistant/airr.py
          python -m pyright src/research_assistant/airr.py
      - name: Commit restoration
        run: |
          rm .github/workflows/restore-airr-review-once.yml
          git config user.name 'Thomas Heisig'
          git config user.email 't_heisig@gmx.de'
          git add -A
          git commit -m 'fix: restore AIRR review boundary'
          git push origin HEAD:main
