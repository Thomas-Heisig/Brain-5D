name: Execute source-frozen empirical campaign
on:
  push:
    branches: [research/empirical-evaluation-20260910]
    paths: [.github/workflows/empirical-campaign.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: empirical-campaign-${{ github.ref }}
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply reviewed source and remove transport
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os, subprocess
          from pathlib import Path
          parts = sorted(Path('.maintenance/empirical-transfer').glob('*.b64'))
          assert len(parts) == 5
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'cf085a03e586cc7037b84c9d254178a3506824873efc58197237b75bf96f15a4'
          target = Path(os.environ['RUNNER_TEMP']) / 'empirical-source.patch'
          target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
          for part in parts:
              part.unlink()
          PY
      - name: Install native and declared numerical comparator
        run: |
          python -m pip install -e '.[dev,docs]' 'brian2==2.10.1'
      - name: Verify engineering contracts on development seeds only
        run: |
          python -m black --check src tests scripts
          python -m ruff check src tests scripts
          python -m mypy src
          python -m pyright
          python -m pytest tests/test_empirical_evaluation.py -q
      - name: Freeze readable source and protocol before evaluation
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'MHRN empirical study (AI-assisted)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests research/protocols research/preregistrations research/registry .maintenance/empirical-transfer
          git diff --cached --check
          git commit -m 'research: freeze exploratory geometry, native association, Brian2 and scaling protocols'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test -z "$(git status --porcelain)"
      - name: Execute every declared runnable protocol once, preserve negative outcomes
        run: python scripts/empirical_campaign.py --output "$RUNNER_TEMP/empirical-campaign"
      - name: Export actual source and execution records
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/empirical-campaign"
          git bundle create "$RUNNER_TEMP/empirical-campaign/source.bundle" --all
          git status --porcelain > "$RUNNER_TEMP/empirical-campaign/tree-status.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/empirical-campaign/HEAD.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: empirical-campaign-data
          path: ${{ runner.temp }}/empirical-campaign/
          retention-days: 14
