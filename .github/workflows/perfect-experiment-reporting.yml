name: Perfect Experiment Reporting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  perfect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Patch semantic reporting and formula viewer
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('src/dashboard/static/index.html')
          text = index.read_text(encoding='utf-8')
          old = '  <script type="module" src="/app.js"></script>\n'
          new = '  <script type="module" src="/formula-renderer.js"></script>\n  <script type="module" src="/app.js"></script>\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('index script insertion target not found')
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          summary = Path('src/research/experiment_summary.py')
          text = summary.read_text(encoding='utf-8')
          start = text.index('def _semantic_status(')
          end = text.index('\n\ndef _fmt(', start)
          replacement = '''def _semantic_status(\n    question_id: str, protocol: str, conditions: set[str]\n) -> tuple[str, str]:\n    """Classify whether the registered RQ is directly or only inclusively tested."""\n\n    plain = {item.split(":", 1)[-1] for item in conditions}\n\n    def status(found: bool, note: str) -> tuple[str, str]:\n        if not found:\n            return "MISMATCH", note\n        if protocol == "science_all_v1":\n            return (\n                "CONTAINS_MATCH",\n                note\n                + " Die relevante Teilstudie ist in science_all_v1 enthalten; "\n                "andere Teilstudien sind fuer diese RQ nicht primaere Evidenz.",\n            )\n        return "DIRECT_MATCH", note\n\n    if question_id.startswith("RQ-PING-"):\n        found = {"recurrence_off", "recurrence_on"}.issubset(plain)\n        return status(found, "PING erwartet recurrence_off und recurrence_on.")\n    if question_id.startswith("RQ-TEMP-"):\n        found = "fast_medium_slow" in plain\n        return status(\n            found,\n            "TEMP erwartet fast_medium_slow mit FAST/MEDIUM/SLOW-Horizonten.",\n        )\n    if question_id.startswith("RQ-TIME-"):\n        time_conditions = {\n            item.split(":", 1)[1]\n            for item in conditions\n            if item.startswith("time:") and ":" in item\n        }\n        direct_conditions = {item for item in conditions if ":" not in item}\n        candidates = time_conditions or direct_conditions\n        found = bool(candidates) and all(item.isdigit() for item in candidates)\n        return status(found, "TIME erwartet numerische Tick-Leiter-Bedingungen.")\n    if question_id.startswith("RQ-5D-"):\n        expected = {"1d", "2d", "3d", "5d", "random_graph"}\n        found = expected.issubset(plain)\n        return status(\n            found, "5D erwartet die registrierten Dimensions-/Topologiebedingungen."\n        )\n    return (\n        "NOT_AUTOMATICALLY_CLASSIFIED",\n        "Keine automatische semantische Regel fuer diese RQ-Familie registriert.",\n    )\n'''
          text = text[:start] + replacement + text[end:]

          old_call = '    semantic_status, semantic_note = _semantic_status(question_id, conditions)\n'
          new_call = '''    protocol = str(\n        simulation.get("protocol", workflow.get("protocol", "NOT_AVAILABLE"))\n        if isinstance(simulation, dict)\n        else workflow.get("protocol", "NOT_AVAILABLE")\n    )\n    semantic_status, semantic_note = _semantic_status(\n        question_id, protocol, conditions\n    )\n'''
          if old_call not in text:
              raise SystemExit('semantic call target not found')
          text = text.replace(old_call, new_call, 1)

          old_protocol = '''        f"- Protokoll: `{simulation.get('protocol', workflow.get('protocol', 'NOT_AVAILABLE')) if isinstance(simulation, dict) else workflow.get('protocol', 'NOT_AVAILABLE')}`",\n'''
          new_protocol = '''        f"- Protokoll: `{protocol}`",\n'''
          if old_protocol not in text:
              raise SystemExit('summary protocol line target not found')
          text = text.replace(old_protocol, new_protocol, 1)

          old_ticks = '''        f"- Tatsächlich ausgeführte Ticks je Lauf: `{min(actual_ticks) if actual_ticks else 'nicht direkt messbar'} .. {max(actual_ticks) if actual_ticks else 'nicht direkt messbar'}`",\n        f"- Tick-Vertrag: `{tick_contract}`",\n'''
          new_ticks = '''        f"- Tickgebundene SNN-Läufe (PING/TEMP/5D): `{min(actual_ticks) if actual_ticks else 'nicht direkt messbar'} .. {max(actual_ticks) if actual_ticks else 'nicht direkt messbar'}` ausgeführte Ticks",\n        f"- Tick-Vertrag: `{tick_contract}`",\n        "- TIME-Ladder: Der angeforderte Endpunkt wird je Seed separat validiert; Zwischenstufen dürfen kleiner sein.",\n        "- Trial-/Regulationsprotokolle: Interne Versuchszyklen sind nicht mit `ticks_executed` gleichzusetzen und werden nicht in die SNN-Tickspanne eingerechnet.",\n'''
          if old_ticks not in text:
              raise SystemExit('summary tick lines target not found')
          text = text.replace(old_ticks, new_ticks, 1)

          old_mismatch = '''        "Ein semantischer Mismatch blockiert die Nutzung des Laufs als Evidenz fuer die registrierte Forschungsfrage, auch wenn die technische Ausfuehrung fehlerfrei war.",\n'''
          new_mismatch = '''        "`DIRECT_MATCH` bezeichnet einen gezielten RQ-spezifischen Lauf. `CONTAINS_MATCH` bedeutet, dass die passende Teilstudie innerhalb einer Gesamtsuite enthalten ist; nur diese Teilstudie ist primaer fuer die registrierte RQ auszuwerten. `MISMATCH` blockiert die Nutzung als Evidenz fuer die registrierte Forschungsfrage, auch wenn die technische Ausfuehrung fehlerfrei war.",\n'''
          if old_mismatch not in text:
              raise SystemExit('semantic explanation target not found')
          text = text.replace(old_mismatch, new_mismatch, 1)

          summary.write_text(text, encoding='utf-8')

          tests = Path('tests/test_scientific_execution_contract.py')
          text = tests.read_text(encoding='utf-8')
          if 'test_summary_semantics_distinguish_direct_and_contained_matches' not in text:
              text += '''\n\ndef test_summary_semantics_distinguish_direct_and_contained_matches() -> None:\n    from src.research.experiment_summary import _semantic_status  # pyright: ignore[reportPrivateUsage]\n\n    direct, _ = _semantic_status(\n        "RQ-TEMP-001", "science_suite_v1", {"fast_medium_slow"}\n    )\n    contained, _ = _semantic_status(\n        "RQ-TEMP-001",\n        "science_all_v1",\n        {"ping:recurrence_off", "temporal:fast_medium_slow", "5d:5d"},\n    )\n    mismatch, _ = _semantic_status(\n        "RQ-TEMP-001", "science_suite_v1", {"recurrence_off", "recurrence_on"}\n    )\n\n    assert direct == "DIRECT_MATCH"\n    assert contained == "CONTAINS_MATCH"\n    assert mismatch == "MISMATCH"\n\n\ndef test_time_semantics_ignore_unrelated_science_all_conditions() -> None:\n    from src.research.experiment_summary import _semantic_status  # pyright: ignore[reportPrivateUsage]\n\n    status, _ = _semantic_status(\n        "RQ-TIME-001",\n        "science_all_v1",\n        {"ping:recurrence_on", "time:100", "time:1000", "temporal:fast_medium_slow"},\n    )\n    assert status == "CONTAINS_MATCH"\n'''
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Format and validate focused contracts
        run: |
          python -m pip install -e ".[dev]"
          python -m black src/research/experiment_summary.py tests/test_scientific_execution_contract.py
          python -m pytest -q tests/test_scientific_execution_contract.py tests/test_research_assistant_output_normalization.py
          python -m mypy src/research/experiment_summary.py
          python -m pyright src/research/experiment_summary.py tests/test_scientific_execution_contract.py
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/static/index.html src/research/experiment_summary.py tests/test_scientific_execution_contract.py
          git commit -m "feat: perfect experiment semantics and scientific formula viewer"
          git push origin HEAD:main
