name: Cognition Integration Verification

on:
  push:
    branches: ['integration/cognition-ethics-20260907']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integration:
    if: github.ref == 'refs/heads/integration/cognition-ethics-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install repository test toolchain
        run: python -m pip install -e '.[dev,docs]'
      - name: Apply scoped corrections from actual checks
        run: python .maintenance/refine_cognition.py
      - name: Narrow validated list type for strict static analysis
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/research/cognition_governance.py')
          text = path.read_text(encoding='utf-8')
          old = '        and bool(value)\n'
          new = '        and bool(cast(list[object], value))\n'
          if old in text:
              if text.count(old) != 1:
                  raise ValueError('Unexpected candidate-list context')
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif new not in text:
              raise ValueError('Candidate-list correction context is missing')
          PY
      - name: Import once, validate, and record actual scoped verification
        run: python .maintenance/cognition_ci.py
