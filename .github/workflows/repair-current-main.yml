name: Repair current main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-current-main.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Patch verified defects
        shell: python
        run: |
          from pathlib import Path
          import re

          server = Path('src/dashboard/server.py')
          text = server.read_text(encoding='utf-8')
          old = '''            experiment_id = body.get("experiment_id")
            if not isinstance(experiment_id, str) or not experiment_id.strip():
                experiment_id = ExperimentWorkflowService(source.root()).catalog()[
                    "next_experiment_id"
                ]
            protocol_result = execute_stdp_pair_experiment(
                experiment_id=experiment_id.strip(), research_root=source.root()
            )'''
          new = '''            experiment_id_value = body.get("experiment_id")
            if isinstance(experiment_id_value, str) and experiment_id_value.strip():
                experiment_id = experiment_id_value.strip()
            else:
                next_experiment_id = ExperimentWorkflowService(source.root()).catalog().get(
                    "next_experiment_id"
                )
                if not isinstance(next_experiment_id, str) or not next_experiment_id.strip():
                    raise WorkflowValidationError("No generated experiment ID is available.")
                experiment_id = next_experiment_id.strip()
            protocol_result = execute_stdp_pair_experiment(
                experiment_id=experiment_id, research_root=source.root()
            )'''
          if old not in text:
              raise SystemExit('server.py target block not found')
          server.write_text(text.replace(old, new), encoding='utf-8')

          probe = Path('src/research/network_probe.py')
          text = probe.read_text(encoding='utf-8')
          text = text.replace(
              '    network_state_digest_after: str | None = None\n',
              '    network_state_digest_after: str | None = None\n'
              '    ticks_executed: int = 0\n'
              '    delivered_synaptic_events: int = 0\n'
              '    synaptic_activity_ticks: int = 0\n'
              '    max_synaptic_current_targets: int = 0\n'
              '    total_synapses: int = 0\n',
              1,
          )
          text = text.replace(
              '            "network_state_digest_after": self.network_state_digest_after,\n',
              '            "network_state_digest_after": self.network_state_digest_after,\n'
              '            "ticks_executed": self.ticks_executed,\n'
              '            "delivered_synaptic_events": self.delivered_synaptic_events,\n'
              '            "synaptic_activity_ticks": self.synaptic_activity_ticks,\n'
              '            "max_synaptic_current_targets": self.max_synaptic_current_targets,\n'
              '            "total_synapses": self.total_synapses,\n',
              1,
          )
          text = text.replace(
              '        spike_sequence: list[tuple[int, int]] = []\n\n        for tick in range(self.max_ticks):\n            result = runtime.step()\n            raw_ids = result.get("output_spike_ids", ())\n            spike_ids = tuple(int(value) for value in raw_ids)\n            if spike_ids:\n                spike_sequence.extend((tick, neuron_id) for neuron_id in spike_ids)\n                response_ticks.append(tick)\n                response_neurons.update(spike_ids)\n                total_spikes += len(spike_ids)\n                peak_rate = max(peak_rate, float(len(spike_ids)))\n                if (\n                    self.source_neuron in spike_ids\n                    and return_latency is None\n                    and tick > 0\n                ):\n                    return_latency = tick\n                if tick > 0 and self.source_neuron in spike_ids:\n                    recurrent_events += 1\n',
              '        spike_sequence: list[tuple[int, int]] = []\n'
              '        ticks_executed = 0\n'
              '        delivered_synaptic_events = 0\n'
              '        synaptic_activity_ticks = 0\n'
              '        max_synaptic_current_targets = 0\n'
              '        total_synapses = 0\n\n'
              '        for tick in range(self.max_ticks):\n'
              '            result = runtime.step()\n'
              '            ticks_executed = tick + 1\n'
              '            raw_ids = result.get("spike_ids")\n'
              '            if raw_ids is None:\n'
              '                raw_ids = result.get("output_spike_ids", ())\n'
              '            spike_ids = tuple(int(value) for value in raw_ids)\n'
              '            output_ids = tuple(\n'
              '                int(value) for value in result.get("output_spike_ids", spike_ids)\n'
              '            )\n'
              '            delivered = int(result.get("delivered_events", 0) or 0)\n'
              '            synaptic_targets = int(result.get("synaptic_current_targets", 0) or 0)\n'
              '            delivered_synaptic_events += delivered\n'
              '            if delivered > 0 or synaptic_targets > 0:\n'
              '                synaptic_activity_ticks += 1\n'
              '            max_synaptic_current_targets = max(\n'
              '                max_synaptic_current_targets, synaptic_targets\n'
              '            )\n'
              '            total_synapses = max(\n'
              '                total_synapses, int(result.get("total_synapses", 0) or 0)\n'
              '            )\n'
              '            if spike_ids:\n'
              '                spike_sequence.extend((tick, neuron_id) for neuron_id in spike_ids)\n'
              '                response_neurons.update(spike_ids)\n'
              '                total_spikes += len(spike_ids)\n'
              '                peak_rate = max(peak_rate, float(len(spike_ids)))\n'
              '                if (\n'
              '                    self.source_neuron in spike_ids\n'
              '                    and return_latency is None\n'
              '                    and tick > 0\n'
              '                ):\n'
              '                    return_latency = tick\n'
              '                if tick > 0 and self.source_neuron in spike_ids:\n'
              '                    recurrent_events += 1\n'
              '            if output_ids:\n'
              '                response_ticks.append(tick)\n',
              1,
          )
          text = text.replace(
              '            network_state_digest_after=after,\n        )\n',
              '            network_state_digest_after=after,\n'
              '            ticks_executed=ticks_executed,\n'
              '            delivered_synaptic_events=delivered_synaptic_events,\n'
              '            synaptic_activity_ticks=synaptic_activity_ticks,\n'
              '            max_synaptic_current_targets=max_synaptic_current_targets,\n'
              '            total_synapses=total_synapses,\n'
              '        )\n',
              1,
          )
          probe.write_text(text, encoding='utf-8')

          suite = Path('src/research/experiment_suite.py')
          text = suite.read_text(encoding='utf-8')
          old = '''    if recurrence:
        network.connect(
            neurons[2], neurons[1], impulse_weight, 1, config=impulse_synapse_config
        )'''
          new = '''    if recurrence:
        network.connect(
            neurons[2], neurons[0], impulse_weight, 1, config=impulse_synapse_config
        )'''
          if old not in text:
              raise SystemExit('experiment_suite.py recurrence block not found')
          suite.write_text(text.replace(old, new), encoding='utf-8')
      - name: Install project tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Format Python
        run: python -m black src tests scripts
      - name: Synchronize documented collected-test count
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, '-m', 'pytest', '--collect-only', '-q'],
              capture_output=True,
              text=True,
              check=False,
          )
          output = result.stdout + '\n' + result.stderr
          match = re.search(r'(\d+) tests collected', output)
          if match is None:
              print(output)
              raise SystemExit('pytest did not report a collected-test count')
          count = match.group(1)
          path = Path('docs/08-roadmap/TODO.md')
          text = path.read_text(encoding='utf-8')
          text, replaced = re.subn(
              r'- \[x\] Current test collection is \d+ tests[^\n]*',
              f'- [x] {count} tests collected on the current main tree.',
              text,
              count=1,
          )
          if replaced != 1:
              text, replaced = re.subn(
                  r'- \[x\] \d+ tests collected[^\n]*',
                  f'- [x] {count} tests collected on the current main tree.',
                  text,
                  count=1,
              )
          if replaced != 1:
              raise SystemExit('TODO test-count claim not found')
          path.write_text(text, encoding='utf-8')
          print(f'documented collected tests: {count}')
      - name: Verify repaired gates
        run: |
          python -m black --check src tests scripts
          python -m mypy src/
          python scripts/check_doc_consistency.py --check-tests
          python -m pytest tests/test_network_probe_temporal.py tests/test_dashboard_experiment_workflow.py -q
      - name: Commit repair
        run: |
          git config user.name "Brain-5D CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src tests scripts docs/08-roadmap/TODO.md
          if git diff --cached --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git commit -m "fix: restore CI and persist observable network activity"
          git push origin HEAD:main
