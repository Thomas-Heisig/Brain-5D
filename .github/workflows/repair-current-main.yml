name: Repair current main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-current-main.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Repair
        run: python scripts/repair_current_main.py
      - name: Format
        run: python -m black src tests scripts
      - name: Verify formatting
        run: python -m black --check src tests scripts
      - name: Verify typing
        run: python -m mypy src/
      - name: Verify documentation
        run: python scripts/check_doc_consistency.py --check-tests
      - name: Verify focused tests
        run: python -m pytest tests/test_network_probe_temporal.py tests/test_dashboard_experiment_workflow.py -q
      - name: Verify real network activity
        run: python scripts/verify_network_activity.py
      - name: Commit
        run: |
          git config user.name "Brain-5D CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src tests scripts docs/08-roadmap/TODO.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: restore CI and persist observable network activity"
            git push origin HEAD:main
          fi
