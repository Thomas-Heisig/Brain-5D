name: Fix strict JSON typing

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-pyright-json.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - run: python scripts/fix_pyright_json_boundaries.py
      - run: python -m black src tests scripts
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src/
      - run: python -m pyright
      - run: python -m pytest -q
      - name: Commit repaired files
        run: |
          git config user.name "Brain-5D CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src scripts
          git commit -m "fix: type JSON boundaries for strict Pyright"
          git push origin HEAD:main
