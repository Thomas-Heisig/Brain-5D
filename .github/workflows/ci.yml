name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday 06:00 UTC

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Global environment
# ---------------------------------------------------------------------------
env:
  PYTHONUNBUFFERED: "1"
  PIP_NO_WARN_SCRIPT_LOCATION: "1"

# ---------------------------------------------------------------------------
# Reusable preparation step
# ---------------------------------------------------------------------------
defaults:
  run:
    shell: bash

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  # =========================================================================
  # Lint & Format
  # =========================================================================
  lint-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Black (src + tests + scripts)
        run: python -m black --check src tests scripts

      - name: Ruff (fast linter)
        run: |
          python -m pip install ruff
          python -m ruff check src/ tests/ scripts/

      - name: Pylint quality threshold
        run: python -m pylint --fail-under=9.0 src

      - name: Whitespace & merge-conflict check
        run: |
          git diff --check
          ! grep -rP '<<<<<<< |=======$|>>>>>>> ' src/ tests/ scripts/ --include='*.py' --include='*.md'

  # =========================================================================
  # Static Type Checking
  # =========================================================================
  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Mypy (full src/)
        run: python -m mypy src/

      - name: Pyright (pyrightconfig.json scope)
        run: python -m pyright

      - name: Pyright (integration scope — alpha.5)
        run: |
          python -m pyright \
            src/storage/structural_journal.py \
            src/storage/structural_recovery.py \
            src/storage/core_restore.py \
            src/self_organization/approval.py \
            src/self_organization/undo.py \
            src/self_organization/plasticity.py \
            src/self_organization/coordinator.py \
            src/dashboard/structural_api.py \
            src/dashboard/operator_bridge.py \
            src/dashboard/server.py \
            src/runtime/control.py \
            src/controller/runtime.py \
            src/visualization/structural_heatmap.py

  # =========================================================================
  # Tests
  # =========================================================================
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Full test suite
        run: python -m pytest -v --tb=short --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

  # =========================================================================
  # Build & Install
  # =========================================================================
  build:
    runs-on: ubuntu-latest
    needs: [lint-format, type-check, tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel installs cleanly
        run: |
          python -m pip install dist/*.whl
          python -c "import brain5d_core; print(brain5d_core.__version__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  # =========================================================================
  # Smoke / Integration
  # =========================================================================
  smoke:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install from built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip install -e ".[dev]"

      - name: Import smoke test
        run: python -c "
          from src.core.neuron import Neuron;
          from src.core.network import NeuralNetwork;
          from src.storage.b5d import B5DReader;
          from src.homeostasis.engine import HomeostasisEngine;
          print('All core imports OK')
          "

      - name: Config loader smoke test
        run: python -c "
          from src.config import load_config;
          cfg = load_config('configs/poc_config.yaml');
          print(f'Config loaded: {cfg[\"dimensions\"]}')
          "

      - name: Verifier (if present)
        if: ${{ hashFiles('scripts/verify_v050a5.py') != '' }}
        run: python scripts/verify_v050a5.py
