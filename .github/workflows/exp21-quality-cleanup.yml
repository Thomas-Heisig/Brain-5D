name: EXP21 quality cleanup

on:
  push:
    branches:
      - research/data-v2-and-operational-rqs

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[quality-cleaned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install quality tools
        run: python -m pip install -e ".[dev]"
      - name: Apply type fixes
        run: python scripts/fix_exp21_typecheck.py
      - name: Auto-format and safe lint fixes
        run: |
          python -m black src tests scripts
          python -m ruff check --fix src tests scripts
          python -m black src tests scripts
      - name: Verify type and targeted tests
        run: |
          python -m mypy src/
          python -m pytest tests/test_research_registry.py tests/test_exp21_operational_protocols.py tests/test_research_data_v2.py tests/test_exp21_followup_runners.py -q
      - name: Commit quality cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git config user.name "Brain-5D Research Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src tests scripts
          git commit -m "ci: clean EXP-GEN-0021 typing and formatting [quality-cleaned]"
          git push origin HEAD:research/data-v2-and-operational-rqs
