name: Gate Freeze Refresh

on:
  push:
    branches:
      - codex/gate-ui-v06

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev,browser]'
      - name: Verify Black before freeze
        run: python -m black --check src tests scripts
      - name: Regenerate canonical verified baseline
        run: python scripts/generate_baseline.py
      - name: Refresh CI-bound gate snapshot
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          baseline = json.loads((root / 'tests/test_baseline.json').read_text(encoding='utf-8'))
          source_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          old = json.loads((root / 'research/generated/verification/phase_b_gate_status.json').read_text(encoding='utf-8'))
          old['generated'] = datetime.now(timezone.utc).isoformat()
          old['source_freeze'] = {
              'commit': source_commit,
              'tested_tree_digest': baseline['tested_tree_digest'],
          }
          old['baseline'] = {
              'python': baseline.get('python', '3.13'),
              'passed': baseline['full_suite'].get('passed', 0),
              'failed': baseline['full_suite'].get('failed', 0),
              'skipped': baseline['full_suite'].get('skipped', 0),
              'collection_errors': baseline['full_collection'].get('collection_errors', 0),
              'artifact': 'tests/test_baseline.json',
          }
          old['continuous_integration'] = {
              'workflow': 'Gate Freeze Refresh / canonical full-suite verification',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': source_commit,
              'conclusion': 'success',
          }
          old['final_validation'] = {
              'command': 'python scripts/generate_baseline.py',
              'passed': baseline['full_suite'].get('passed', 0),
              'failed': baseline['full_suite'].get('failed', 0),
              'skipped': baseline['full_suite'].get('skipped', 0),
          }
          (root / 'research/generated/verification/phase_b_gate_status.json').write_text(
              json.dumps(old, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Remove temporary refresh workflow
        run: rm -f .github/workflows/gate-freeze-refresh.yml
      - name: Commit refreshed freeze and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(gate): refresh verified source freeze"
          git push origin HEAD:codex/gate-ui-v06
