name: v0.6 type-format fix

on:
  push:
    branches: [work/research-ui-v06-todo-cleanup]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
      - name: Format touched Python files
        run: |
          python -m black src/dashboard/experiment_archive.py src/diagnostics/performance_contract.py tests/test_experiment_archive.py
          python -m ruff check --fix src/dashboard/experiment_archive.py src/diagnostics/performance_contract.py tests/test_experiment_archive.py
      - name: Verify both type checkers
        run: |
          python -m mypy src/
          python -m pyright
      - name: Commit formatting if needed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dashboard/experiment_archive.py src/diagnostics/performance_contract.py tests/test_experiment_archive.py
          if git diff --cached --quiet; then
            echo 'No formatting changes'
          else
            git commit -m 'style: format final v0.6 type fixes'
            git push
          fi
