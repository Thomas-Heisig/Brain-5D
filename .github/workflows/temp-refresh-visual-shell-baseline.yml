name: Temporary refresh visual-shell source baseline

on:
  push:
    branches: [frontend/visual-shell-v2-20260911]
    paths:
      - ".github/workflows/temp-refresh-visual-shell-baseline.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Generate source-bound baseline
        run: |
          python -m black --check src tests scripts
          python -m ruff check src tests scripts
          python scripts/generate_baseline.py
          python scripts/check_doc_consistency.py --check-tests
          python scripts/check_connectome_integrity.py
      - name: Commit generated verification
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_baseline.json research/generated/verification
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: refresh visual-shell source-bound verification"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
