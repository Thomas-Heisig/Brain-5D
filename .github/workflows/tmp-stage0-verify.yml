name: Temporary Stage0 Verify

on:
  push:
    branches:
      - feature/single-neuron-model-contract

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/single-neuron-model-contract
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply integration patch
        run: |
          sed -i 's/class SynapseConfig/class EnergyConfig/g' scripts/tmp_stage0_integrate.py
          sed -i 's/_validate_synapse_config/_validate_energy_config/g' scripts/tmp_stage0_integrate.py
          python scripts/tmp_stage0_integrate.py
      - name: Install tools
        run: python -m pip install -e ".[dev]" python-docx
      - name: Format
        run: |
          python -m ruff check --fix src/core/neuron.py src/core/neuron_models.py src/core/network.py src/config/loader.py src/dashboard/development_timeline.py tests/test_single_neuron_contract.py
          python -m black src/core/neuron.py src/core/neuron_models.py src/core/network.py src/config/loader.py src/dashboard/development_timeline.py tests/test_single_neuron_contract.py
          python -m ruff check src/core/neuron.py src/core/neuron_models.py src/core/network.py src/config/loader.py src/dashboard/development_timeline.py tests/test_single_neuron_contract.py
      - name: Type check
        run: python -m mypy src/core/neuron.py src/core/neuron_models.py src/core/network.py src/config/loader.py src/dashboard/development_timeline.py
      - name: Verify Stage 0
        run: python -m pytest -q tests/test_neuron.py tests/test_single_neuron_contract.py
      - name: Promote verification artifact
        run: python -c "import json,pathlib; p=pathlib.Path('research/generated/verification/single_neuron_reference.json'); d=json.loads(p.read_text()); d['status']='verified'; d['verification_scope']='Stage-0 software contract; not biological validation'; d['proofs']={'golden_trajectory':True,'deterministic_replay':True,'spike_reset_recovery':True,'optional_refractory_variant':True,'state_roundtrip':True,'model_switch_provenance':True,'yaml_model_selection':True}; p.write_text(json.dumps(d,indent=2)+'\n')"
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-stage0-verify.yml scripts/tmp_stage0_integrate.py
          git add src/core/network.py src/config/loader.py src/dashboard/development_timeline.py tests/test_single_neuron_contract.py research/generated/verification/single_neuron_reference.json src/core/neuron.py src/core/neuron_models.py
          git commit -m "feat(neuron): integrate selectable model contract end to end"
          git push origin HEAD:feature/single-neuron-model-contract
