name: Materialize reviewed connectome integration

on:
  push:
    branches: [research/connectome-embodiment-20260909]
    paths:
      - '.github/workflows/connectome-stage.yml'
      - '.integration/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connectome-integration-stage
  cancel-in-progress: false

jobs:
  integrate:
    if: github.ref == 'refs/heads/research/connectome-embodiment-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Materialize exact reviewed patch and retire transport
        shell: bash
        run: |
          git config user.name 'MHRN research integration (AI-assisted)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import hashlib
          import io
          import lzma
          import os
          import shutil
          import subprocess
          from pathlib import Path
          parts = sorted(Path('.integration').glob('connectome-*.bin'))
          expected = [f'connectome-{i}.bin' for i in range(5)]
          if [p.name for p in parts] != expected:
              raise SystemExit('Unexpected transport inventory')
          compressed = b''.join(p.read_bytes() for p in parts)
          if len(compressed) != 41900 or hashlib.sha256(compressed).hexdigest() != '06e330a0ffaaf331d37b1a5fd92ffc9d101f78749676c154d8dd7c27ef2bea09':
              raise SystemExit('Compressed patch integrity failure')
          with lzma.LZMAFile(io.BytesIO(compressed)) as stream:
              raw = stream.read(1000000)
              if stream.read(1):
                  raise SystemExit('Patch exceeds bounded size')
          if len(raw) != 209670 or hashlib.sha256(raw).hexdigest() != '7a1c64d3674e5d5fe1420ca7a22296c09fb42f77dd699bb0fd809d96cb272ab6':
              raise SystemExit('Reviewed patch integrity failure')
          patch = Path(os.environ['RUNNER_TEMP']) / 'connectome-reviewed.patch'
          patch.write_bytes(raw)
          subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          shutil.copyfile('.integration/connectome-research.yml', '.github/workflows/connectome-research.yml')
          subprocess.run(['git', 'add', '.github/workflows/connectome-research.yml'], check=True)
          subprocess.run(['git', 'rm', '--', *map(str, parts), '.integration/connectome-research.yml', '.github/workflows/connectome-stage.yml'], check=True)
          PY
          git diff --cached --check
          git commit -m 'feat(research): integrate connectome sources, controlled embodiment studies and integrity gates'
      - name: Install canonical verification tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev,docs]' pre-commit bandit build
      - name: Verify code, research contracts and immutable history
        run: |
          python -m black --check src tests scripts
          python -m ruff check src tests scripts
          python -m mypy src
          python -m pyright
          python -m bandit -c pyproject.toml -r src -ll
          python scripts/check_connectome_integrity.py
          python -m pytest -q tests/test_connectome_embodiment.py tests/test_dashboard_experiment_workflow.py tests/test_gateway_runtime.py tests/test_exp21_operational_protocols.py tests/test_ai_governance.py tests/test_research_registry.py
          git diff --exit-code origin/main -- research/experiments research/registry/evidence research/publications/2026-09-07_ki-die-geliehene-intelligenz
      - name: Generate genuine complete-suite and deterministic verification
        run: |
          python scripts/generate_baseline.py
          python scripts/generate_determinism_artifact.py
          python research/generate_reports.py
          python scripts/generate_catalog_audit_report.py
          python scripts/check_doc_consistency.py --check-tests
          python scripts/publication_bundle.py
          python scripts/publication_revision.py
          python scripts/publication_cognition.py
          python scripts/publication_naming.py
      - name: Publish verified feature source without overwriting concurrent work
        run: |
          git add tests/test_baseline.json research/generated
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'test(research): publish genuine source-bound verification and regenerated research catalog'
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:refs/heads/research/connectome-embodiment-20260909
      - name: Export source and diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/connectome-stage-result"
          git bundle create "$RUNNER_TEMP/connectome-stage-result/repository.bundle" --all
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/connectome-stage-result/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/connectome-stage-result/HEAD.txt"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/connectome-stage-result/status.txt"
          git diff HEAD > "$RUNNER_TEMP/connectome-stage-result/uncommitted.patch"
          cp tests/test_baseline.json "$RUNNER_TEMP/connectome-stage-result/test-baseline.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: connectome-stage-result
          path: ${{ runner.temp }}/connectome-stage-result/
          retention-days: 7
