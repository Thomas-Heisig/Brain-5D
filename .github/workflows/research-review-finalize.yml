name: Research Review Finalizer

on:
  push:
    branches: [codex/research-review-roadmap-v1-2]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply review inbox and roadmap changes
        run: python .maintenance/implement_review_inbox.py
      - name: Install project and validation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Format and validate focused changes
        run: |
          python -m black src/dashboard/review_inbox.py tests/test_review_inbox.py src/dashboard/server.py
          python -m ruff check src/dashboard/review_inbox.py tests/test_review_inbox.py src/dashboard/server.py
          python -m mypy src/dashboard/review_inbox.py
          python -m pyright src/dashboard/review_inbox.py
          python -m pytest tests/test_review_inbox.py tests/test_airr_pipeline.py tests/test_research_dashboard_routes.py -q
          node --check src/dashboard/static/experiment-workflow.js
          git diff --check
      - name: Regenerate deterministic test baseline
        run: python scripts/generate_baseline.py
      - name: Validate documentation consistency
        run: python scripts/check_docs_consistency.py
      - name: Remove temporary finalizer and implementation script
        run: |
          rm .github/workflows/research-review-finalize.yml
          rm .maintenance/implement_review_inbox.py
      - name: Commit finalized feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(research): add review inbox and roadmap through v1.2"
          git push origin HEAD:codex/research-review-roadmap-v1-2
