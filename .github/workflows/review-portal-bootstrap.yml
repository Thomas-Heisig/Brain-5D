# One-time catalogue materialization on the explicitly authorized implementation branch.
# Remove this workflow after the generated file is reviewed; never writes main.
name: Review portal catalogue bootstrap
on:
  push:
    branches: [feature/external-review-portal-20260910]
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'Thomas-Heisig/MHRN'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/external-review-portal-20260910
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Generate and verify canonical browser catalogue
        run: |
          python -m review_portal.build
          python -m review_portal.build --check
      - name: Commit only generated catalogue, without force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/dashboard/static/review/instrument.js
          if ! git diff --cached --quiet; then
            git commit -m 'build(review): materialize versioned questionnaire catalogue'
            git push origin HEAD:refs/heads/feature/external-review-portal-20260910
          fi
