name: Integrate reviewed questionnaire and cognition changes
on:
  push:
    branches: [fix/complete-experiments-provider-repo-context-20260910]
    paths: ['.github/workflows/integrate-review-20260910.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/complete-experiments-provider-repo-context-20260910
          fetch-depth: 0
      - name: Verify integration head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply checksum-verified reviewed source patch
        run: |
          python - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          parts = sorted(Path('.maintenance/review-integration').glob('*.patch'))
          assert len(parts) == 9
          payload = b''.join(path.read_bytes() for path in parts)
          assert hashlib.sha256(payload).hexdigest() == '181372c5830fa7cfabdda8cd1c11bcfb25c988c2a72d827c4ce2c8b56d96f5d8'
          patch = Path(os.environ['RUNNER_TEMP']) / 'reviewed-integration.patch'
          patch.write_bytes(payload)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(patch)], check=True)
          for path in parts:
              path.unlink()
          # Workflow edits are committed separately through the authorized API.
          # This runner only pushes source, tests, documentation and verification.
          subprocess.run(['git', 'restore', '--source=HEAD', '--worktree', '.github/workflows'], check=True)
          subprocess.run(['git', 'diff', '--exit-code', '--', '.github/workflows'], check=True)
          PY
      - name: Install project and validation tools
        run: |
          python -m pip install -e '.[dev,docs]'
          python -m pip install -r review_portal/requirements.txt httpx
      - name: Format and verify integration
        run: |
          python -m black src tests scripts
          python -m ruff check src tests scripts
          python -m mypy src
          python -m pyright
          python -m pytest tests/test_external_review_integration.py tests/test_cognition_operational_experiments.py tests/test_cognition_program.py tests/test_backend_frontend_coverage.py tests/test_repository_ai_context.py tests/test_language_organ_contracts.py -q
          python -m review_portal.build --check
          python -m pytest review_portal/tests/test_portal.py -q
          node --test review_portal/tests/model.test.mjs
      - name: Commit reviewed source before verification freeze
        run: |
          git config user.name 'MHRN integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'feat: integrate external review with cognition and preserve assessment boundaries'
          git push origin HEAD:fix/complete-experiments-provider-repo-context-20260910
      - name: Generate actual clean full-suite baseline
        run: python scripts/generate_baseline.py
      - name: Persist genuinely executed verification
        run: |
          git add tests/test_baseline.json research/generated/verification
          git commit -m 'test: refresh executed integration baseline' || test -z "$(git diff --cached --name-only)"
          git push origin HEAD:fix/complete-experiments-provider-repo-context-20260910
      - name: Record diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/integration-diagnostics"
          git rev-parse HEAD > "$RUNNER_TEMP/integration-diagnostics/head.txt"
          git status --short > "$RUNNER_TEMP/integration-diagnostics/status.txt"
          git diff --stat > "$RUNNER_TEMP/integration-diagnostics/diff-stat.txt"
          cp tests/test_baseline.json "$RUNNER_TEMP/integration-diagnostics/" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-integration-verification
          path: ${{ runner.temp }}/integration-diagnostics/
          retention-days: 3
