name: EXP21 operationalization

on:
  push:
    branches:
      - research/data-v2-and-operational-rqs

permissions:
  contents: write

jobs:
  operationalize:
    if: ${{ !contains(github.event.head_commit.message, '[exp21-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply idempotent migrations
        run: |
          python scripts/apply_exp21_operationalization.py
          python scripts/fix_exp21_generalization.py
      - name: Syntax check touched Python modules
        run: |
          python -m py_compile src/research/data_v2.py
          python -m py_compile src/research/followup_experiments.py
          python -m py_compile src/research/protocol_registry.py
          python -m py_compile src/research_assistant/assistant.py
          python -m py_compile src/dashboard/experiment_workflow.py
          python -m py_compile src/research/experiment_summary.py
      - name: Commit generated operationalization
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "Brain-5D Research Automation"
          git config user.email "actions@users.noreply.github.com"
          git add research/registry/questions.yaml research/registry/hypotheses.yaml src/research_assistant/assistant.py src/dashboard/experiment_workflow.py src/research/experiment_summary.py src/research/followup_experiments.py
          git commit -m "research: operationalize EXP-GEN-0021 follow-ups [exp21-applied]"
          git push origin HEAD:research/data-v2-and-operational-rqs
