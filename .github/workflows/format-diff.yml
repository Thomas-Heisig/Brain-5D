name: Finalize Experiment Contracts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply targeted repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('src/dashboard/experiment_workflow.py')
          text = workflow.read_text(encoding='utf-8')
          old = '''        if runner_name in exact_window_runners:\n            observed = [\n                run.metrics.get("ticks_executed")\n                for run in runs\n                if isinstance(run.metrics, dict)\n            ]\n            if not observed or any(\n                not isinstance(value, int) or value < requested_ticks\n                for value in observed\n            ):\n                raise WorkflowValidationError(\n                    f"Tick contract violated: runner {runner_name} did not execute at least {requested_ticks} ticks in every run."\n                )\n            observed_ints = [int(value) for value in observed]\n'''
          new = '''        if runner_name in exact_window_runners:\n            observed_ints: list[int] = []\n            for run in runs:\n                if not isinstance(run.metrics, dict):\n                    raise WorkflowValidationError(\n                        f"Tick contract violated: runner {runner_name} returned an invalid metrics payload."\n                    )\n                value = run.metrics.get("ticks_executed")\n                if (\n                    isinstance(value, bool)\n                    or not isinstance(value, int)\n                    or value < requested_ticks\n                ):\n                    raise WorkflowValidationError(\n                        f"Tick contract violated: runner {runner_name} did not execute at least {requested_ticks} ticks in every run."\n                    )\n                observed_ints.append(value)\n            if not observed_ints:\n                raise WorkflowValidationError(\n                    f"Tick contract violated: runner {runner_name} produced no runs."\n                )\n'''
          if old not in text:
              raise SystemExit('workflow tick-validation patch target not found')
          workflow.write_text(text.replace(old, new), encoding='utf-8')

          summary = Path('src/research/experiment_summary.py')
          text = summary.read_text(encoding='utf-8')
          old = '''        metrics = run.get("metrics") if isinstance(run.get("metrics"), dict) else {}\n'''
          new = '''        metrics_value = run.get("metrics")\n        metrics: dict[str, Any] = (\n            dict(metrics_value) if isinstance(metrics_value, dict) else {}\n        )\n'''
          if old not in text:
              raise SystemExit('summary metrics patch target not found')
          text = text.replace(old, new)

          old = '''        for heading, key in (\n            ("Methodische Kritik", "methodological_critique"),\n            ("Alternative Erklaerungen", "alternative_explanations"),\n            ("Fehlende Nachweise", "missing_evidence"),\n            ("Empfohlene Folgeexperimente", "recommended_follow_up"),\n        ):\n            values = content.get(key, []) if isinstance(content, dict) else []\n            lines.extend(\n                [\n                    "",\n                    (\n                        f"### 8.2 {heading}"\n                        if heading == "Methodische Kritik"\n                        else f"### {heading}"\n                    ),\n                    "",\n                ]\n            )\n            if isinstance(values, list) and values:\n                lines.extend(f"- {value}" for value in values)\n            else:\n                lines.append("- Keine expliziten Angaben.")\n'''
          new = '''        interpretation = (\n            content.get("interpretation", {}) if isinstance(content, dict) else {}\n        )\n        if not isinstance(interpretation, dict):\n            interpretation = {}\n\n        methodological = (\n            content.get("methodological_critique", [])\n            if isinstance(content, dict)\n            else []\n        )\n        alternatives = (\n            content.get("alternative_explanations", [])\n            if isinstance(content, dict)\n            else []\n        )\n        missing = content.get("missing_evidence", []) if isinstance(content, dict) else []\n        if not isinstance(missing, list) or not missing:\n            missing = interpretation.get("requested_evidence", [])\n        if not isinstance(missing, list) or not missing:\n            limitations: list[str] = []\n            observation_sources = [interpretation.get("observations", [])]\n            if isinstance(content, dict):\n                observation_sources.append(content.get("observations", []))\n            for source in observation_sources:\n                if not isinstance(source, list):\n                    continue\n                for item in source:\n                    if not isinstance(item, dict):\n                        continue\n                    item_type = item.get("type")\n                    item_value = item.get("value")\n                    if (\n                        isinstance(item_type, str)\n                        and item_type.lower() in {"limitation", "limitations"}\n                        and isinstance(item_value, str)\n                        and item_value.strip()\n                    ):\n                        limitations.append(\n                            f"AIRR-Limitation dokumentieren: {item_value.strip()}"\n                        )\n            missing = limitations\n        if not isinstance(missing, list) or not missing:\n            missing = [\n                "Keine expliziten zusätzlichen Nachweise im AIRR angegeben."\n            ]\n\n        follow_up = (\n            content.get("recommended_follow_up", [])\n            if isinstance(content, dict)\n            else []\n        )\n        if not isinstance(follow_up, list) or not follow_up:\n            follow_up = interpretation.get("recommended_experiments", [])\n        if not isinstance(follow_up, list) or not follow_up:\n            follow_up = [\n                "Keine expliziten Folgeexperimente im AIRR angegeben."\n            ]\n\n        for heading, values in (\n            ("Methodische Kritik", methodological),\n            ("Alternative Erklaerungen", alternatives),\n            ("Fehlende Nachweise", missing),\n            ("Empfohlene Folgeexperimente", follow_up),\n        ):\n            lines.extend(["", f"### {heading}", ""])\n            if isinstance(values, list) and values:\n                lines.extend(f"- {value}" for value in values)\n            else:\n                lines.append("- Keine expliziten Angaben.")\n'''
          if old not in text:
              raise SystemExit('summary AIRR fallback patch target not found')
          summary.write_text(text.replace(old, new), encoding='utf-8')

          todo = Path('docs/08-roadmap/TODO.md')
          text = todo.read_text(encoding='utf-8')
          text = text.replace('735 tests collected', '746 tests collected')
          todo.write_text(text, encoding='utf-8')

          frontend = Path('src/dashboard/static/experiment-workflow.js')
          text = frontend.read_text(encoding='utf-8')
          old = '''      if (result.evidence_id) lines.push(`Evidenz: ${result.evidence_id}`);\n      if (result.data_id) lines.push(`Daten: ${result.data_id}`);\n      const runResult = result.result;\n'''
          new = '''      if (result.evidence_id) lines.push(`Evidenz: ${result.evidence_id}`);\n      if (result.data_id) lines.push(`Daten: ${result.data_id}`);\n      if (result.workflow) lines.push(`Workflow: research/${result.workflow}`);\n      if (result.summary) lines.push(`Zusammenfassung: research/${result.summary}`);\n      if (result.statistics) lines.push(`Statistik: research/${result.statistics}`);\n      const runResult = result.result;\n      if (runResult && typeof runResult === "object") {\n        if (runResult.runner) lines.push(`Runner: ${runResult.runner}`);\n        if (typeof runResult.ticks_requested === "number") {\n          lines.push(`Ticks angefordert: ${runResult.ticks_requested}`);\n        }\n        if (runResult.tick_validation?.status) {\n          lines.push(`Tick-Vertrag: ${runResult.tick_validation.status}`);\n        }\n      }\n'''
          if old not in text:
              raise SystemExit('frontend result patch target not found')
          frontend.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Format Python
        run: |
          python -m pip install black
          python -m black src tests scripts
      - name: Commit repairs if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git commit -m "fix: finalize scientific execution and reporting contracts"
          git push origin HEAD:main
