                      helper = r'''

def _experimental_schema_mermaid(
    question_id: str,
    hypothesis_id: str,
    protocol_id: str,
    controls: Sequence[str],
    treatments: Sequence[str],
    outcomes: Sequence[str],
) -> str:
    """Return a deterministic Mermaid representation of an experiment contract."""
    lines = [
        "```mermaid",
        "graph TD",
        f'    RQ["{question_id}"] --> H["{hypothesis_id}"]',
        f'    H --> P["{protocol_id}"]',
    ]
    for i, item in enumerate(controls):
        lines.append(f'    P --> C{i}["Control: {item}"]')
    for i, item in enumerate(treatments):
        lines.append(f'    P --> T{i}["Treatment: {item}"]')
    lines.append('    P --> M["Measured outcomes"]')
    for i, item in enumerate(outcomes):
        lines.append(f'    M --> O{i}["{item}"]')
    lines.append("```")
    return "\n".join(lines)

'''
                      s = s[:idx] + helper + s[idx:]
