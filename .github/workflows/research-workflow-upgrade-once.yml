// ================================================================
// Research-document links and Mermaid rendering
// ================================================================

function resolveFMRelativePath(currentPath, href) {
  if (!href || /^(?:[a-z]+:|#|\/)/i.test(href)) return href;
  const cleaned = href.replace(/\\_/g, '_').split('#')[0].split('?')[0];
  const base = (currentPath || '').split('/').slice(0, -1);
  const parts = [...base, ...cleaned.split('/')];
  const stack = [];
  for (const part of parts) {
    if (!part || part === '.') continue;
    if (part === '..') {
      if (!stack.length) return null;
      stack.pop();
      continue;
    }
    stack.push(part);
  }
  return stack.join('/');
}

async function renderMermaidBlocks(container) {
  const blocks = container.querySelectorAll('pre code.language-mermaid, code.language-mermaid');
  if (!blocks.length) return;
  if (!window.mermaid) {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
    script.onload = () => {
      window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
      renderMermaidBlocks(container);
    };
    document.head.appendChild(script);
    return;
  }
  let idx = 0;
  for (const code of blocks) {
    const source = code.textContent || '';
    const pre = code.closest('pre') || code;
    const host = document.createElement('div');
    host.className = 'fm-mermaid';
    try {
      const id = `fm-mermaid-${Date.now()}-${idx++}`;
      const result = await window.mermaid.render(id, source);
      host.innerHTML = result.svg;
    } catch (err) {
      host.innerHTML = `<div class="fm-error">Mermaid render error: ${escapeHtml(err.message || String(err))}</div>`;
    }
    pre.replaceWith(host);
  }
}

function wireMarkdownRelativeLinks(container, currentPath) {
  container.querySelectorAll('a[href]').forEach(anchor => {
    const href = anchor.getAttribute('href');
    if (!href || /^(?:https?:|mailto:|#)/i.test(href)) return;
    const resolved = resolveFMRelativePath(currentPath, href);
    if (!resolved) {
      anchor.classList.add('fm-link-invalid');
      anchor.title = 'Blocked unsafe relative path';
      return;
    }
    anchor.addEventListener('click', event => {
      event.preventDefault();
      openFMFile(resolved);
    });
  });
}
'''
              js = js.replace(marker, helper + '\n' + marker, 1)

