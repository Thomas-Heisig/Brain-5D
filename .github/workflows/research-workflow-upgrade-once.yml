name: Research Workflow Upgrade Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-workflow-upgrade-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Implement research workflow upgrade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          # ------------------------------------------------------------
          # 1. Backend research contract + review helpers
          # ------------------------------------------------------------
          p = root / 'src/dashboard/experiment_workflow.py'
          text = p.read_text(encoding='utf-8')
          if 'def build_research_contract(' not in text:
              insert_at = text.find('\nclass WorkflowValidationError')
              helpers = r'''


def build_research_contract(
    research_root: Path,
    *,
    question_id: str,
    hypothesis_id: str,
    protocol_id: str,
    requested_seeds: Sequence[int],
    requested_ticks: int | None,
    git_dirty: bool = False,
    brain5d_version: str | None = None,
) -> dict[str, Any]:
    """Build a user-visible execution contract before an experiment starts."""
    protocol = protocol_by_id(research_root, protocol_id)
    prereg_path = research_root / str(protocol.get("preregistration", ""))
    prereg = json.loads(prereg_path.read_text(encoding="utf-8"))
    seed_strategy = prereg.get("seed_strategy", {})
    minimum_seeds = int(seed_strategy.get("minimum_independent_seeds", 1))
    default_ticks = protocol.get("default_ticks")
    effective_ticks = requested_ticks if requested_ticks is not None else default_ticks
    seed_count = len({int(seed) for seed in requested_seeds})
    violations: list[str] = []
    warnings: list[str] = []
    if seed_count < minimum_seeds:
        violations.append(
            f"Seed count {seed_count} is below preregistered minimum {minimum_seeds}."
        )
    if git_dirty:
        violations.append("Git working tree is dirty; confirmatory execution is not eligible.")
    if not brain5d_version or brain5d_version == "unknown":
        violations.append("Brain-5D version is unknown; confirmatory execution is not eligible.")
    if requested_ticks is not None and default_ticks is not None and requested_ticks != default_ticks:
        warnings.append(
            f"Requested ticks ({requested_ticks}) differ from protocol default ({default_ticks})."
        )
    mode = str(prereg.get("mode", "EXPLORATORY"))
    eligibility = "CONFIRMATORY_ELIGIBLE"
    if violations:
        eligibility = "EXPLORATORY_ONLY"
    return {
        "question_id": question_id,
        "hypothesis_id": hypothesis_id,
        "protocol_id": protocol_id,
        "mode": mode,
        "eligibility": eligibility,
        "requested_seeds": list(requested_seeds),
        "seed_count": seed_count,
        "minimum_independent_seeds": minimum_seeds,
        "seed_rule": seed_strategy.get("rule"),
        "ticks": effective_ticks,
        "default_ticks": default_ticks,
        "conditions": prereg.get("conditions", []),
        "primary_outcomes": prereg.get("primary_outcomes", []),
        "secondary_outcomes": prereg.get("secondary_outcomes", []),
        "inclusion_criteria": prereg.get("inclusion_criteria", []),
        "exclusion_criteria": prereg.get("exclusion_criteria", []),
        "inference_policy": (prereg.get("analysis_plan") or {}).get("inference_policy"),
        "freeze": prereg.get("freeze", {}),
        "controls": protocol.get("controls", []),
        "treatments": protocol.get("treatments", []),
        "warnings": warnings,
        "violations": violations,
    }


def write_human_review(
    experiment_dir: Path,
    *,
    reviewer: str,
    decision: str,
    notes: str,
    checklist: dict[str, bool],
    reviewed_at: str,
) -> Path:
    """Write an immutable human-review record bound to current experiment artefacts."""
    allowed = {
        "ACCEPT_FOR_REVIEWED_RECORD",
        "ACCEPT_AS_EXPLORATORY",
        "REQUEST_FOLLOW_UP",
        "REJECT",
    }
    if decision not in allowed:
        raise WorkflowValidationError(f"Unsupported human review decision: {decision}")
    import hashlib
    def digest_file(path: Path) -> str | None:
        return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
    review_dir = experiment_dir / "review"
    review_dir.mkdir(parents=True, exist_ok=True)
    existing = sorted(review_dir.glob("HUMAN-REVIEW-*.json"))
    review_id = f"HUMAN-REVIEW-{len(existing)+1:04d}"
    target = review_dir / f"{review_id}.json"
    payload = {
        "schema_version": "1.0",
        "review_id": review_id,
        "experiment_id": experiment_dir.name,
        "reviewer": reviewer.strip(),
        "decision": decision,
        "status": "REVIEWED",
        "reviewed_at": reviewed_at,
        "notes": notes,
        "checklist": checklist,
        "digests": {
            "manifest": digest_file(experiment_dir / "manifest.json"),
            "statistics": digest_file(experiment_dir / "analysis" / "statistics.json"),
            "summary": digest_file(experiment_dir / "summary.md"),
        },
    }
    target.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
    return target
'''
