            "freeze": {"status": "FROZEN"},
            "analysis_plan": {"inference_policy": "Matched controls required."},
        }), encoding="utf-8")
    return root


def test_research_contract_exposes_preregistered_execution_requirements(tmp_path: Path) -> None:
    root = _research_root(tmp_path)
    contract = build_research_contract(
        root,
        question_id="RQ-5D-005",
        hypothesis_id="H-5D-005-A",
        protocol_id="topology_matched_5d_v1",
        requested_seeds=list(range(101, 131)),
        requested_ticks=64,
        git_dirty=False,
        brain5d_version="0.5.0a7",
    )
    assert contract["eligibility"] == "CONFIRMATORY_ELIGIBLE"
    assert contract["minimum_independent_seeds"] == 30
    assert contract["ticks"] == 64
    assert contract["controls"] == ["1d", "2d", "3d"]


def test_research_contract_downgrades_dirty_or_underseeded_run(tmp_path: Path) -> None:
    root = _research_root(tmp_path)
