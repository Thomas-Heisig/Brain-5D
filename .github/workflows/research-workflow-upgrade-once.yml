    assert first.name == "HUMAN-REVIEW-0001.json"
    assert second.name == "HUMAN-REVIEW-0002.json"
    payload = json.loads(first.read_text(encoding='utf-8'))
    assert payload["status"] == "REVIEWED"
    assert payload["digests"]["manifest"]
''', encoding='utf-8')

