    (root / "preregistrations" / "PREREG-5D-005.json").write_text(
        json.dumps({
            "mode": "CONFIRMATORY",
            "primary_outcomes": ["total_spikes"],
            "secondary_outcomes": ["activated_neurons"],
            "conditions": [{"id": "1d", "role": "control"}, {"id": "5d", "role": "treatment"}],
