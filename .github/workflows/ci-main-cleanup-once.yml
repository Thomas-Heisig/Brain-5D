name: CI Main Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-main-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Repair canonical bindings, source-freeze digest and EOF hygiene
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          test_path = Path('tests/test_dashboard_experiment_workflow.py')
          text = test_path.read_text(encoding='utf-8')

          old_questions = (
              '        "- id: RQ-SNN-002\\n  domain: snn\\n  question: Does it link?\\n  relevance: test\\n",\n'
          )
          new_questions = (
              '        "- id: RQ-SNN-002\\n  domain: snn\\n  question: Does it link?\\n  relevance: test\\n"\n'
              '        "- id: RQ-TIME-001\\n  domain: timing\\n  question: Does timing scale?\\n  relevance: test\\n"\n'
              '        "- id: RQ-SUITE-001\\n  domain: research-infrastructure\\n  question: Does the suite execute?\\n  relevance: test\\n",\n'
          )
          if old_questions not in text:
              raise SystemExit('question registry fixture anchor not found')
          text = text.replace(old_questions, new_questions, 1)

          old_hypotheses = (
              '        "- id: H-SNN-001-A\\n  research_question: RQ-SNN-001\\n  hypothesis: It advances ticks.\\n",\n'
          )
          new_hypotheses = (
              '        "- id: H-SNN-001-A\\n  research_question: RQ-SNN-001\\n  hypothesis: It advances ticks.\\n"\n'
              '        "- id: H-SNN-002-A\\n  research_question: RQ-SNN-002\\n  hypothesis: It produces an impulse response.\\n"\n'
              '        "- id: H-TIME-001-A\\n  research_question: RQ-TIME-001\\n  hypothesis: Timing execution is measurable.\\n"\n'
              '        "- id: H-SUITE-001-A\\n  research_question: RQ-SUITE-001\\n  hypothesis: The registered suite executes consistently.\\n",\n'
          )
          if old_hypotheses not in text:
              raise SystemExit('hypothesis registry fixture anchor not found')
          text = text.replace(old_hypotheses, new_hypotheses, 1)

          bindings = {
              'EXP-PING-0001': ('RQ-SNN-002', 'H-SNN-002-A'),
              'EXP-GEN-0001': ('RQ-SNN-002', 'H-SNN-002-A'),
              'EXP-GEN-0002': ('RQ-SNN-002', 'H-SNN-002-A'),
              'EXP-GEN-0003': ('RQ-SNN-002', 'H-SNN-002-A'),
              'EXP-GEN-ALL-0001': ('RQ-SUITE-001', 'H-SUITE-001-A'),
              'EXP-MANUAL-0001': ('RQ-TIME-001', 'H-TIME-001-A'),
          }
          for experiment_id, (rq, hypothesis) in bindings.items():
              pattern = re.compile(
                  rf'("experiment_id": "{re.escape(experiment_id)}",\n'
                  rf'\s+"question_id": ")RQ-SNN-001(",\n'
                  rf'\s+"hypothesis_id": ")H-SNN-001-A(")'
              )
              text, count = pattern.subn(rf'\1{rq}\2{hypothesis}\3', text)
              expected = 2 if experiment_id == 'EXP-PING-0001' else 1
              if count != expected:
                  raise SystemExit(
                      f'{experiment_id}: expected {expected} binding replacements, got {count}'
                  )
          test_path.write_text(text, encoding='utf-8')

          source_path = Path('src/dashboard/experiment_workflow.py')
          source = source_path.read_text(encoding='utf-8')
          source = source.replace('import json\nimport marshal\n', 'import json\n', 1)
          old_digest = '''def _code_digest(code: CodeType) -> str:\n    return hashlib.sha256(marshal.dumps(code)).hexdigest()\n'''
          new_digest = '''def _code_digest(code: CodeType) -> str:\n    """Hash executable code semantics while ignoring path/debug metadata.\n\n    Raw marshal bytes include interpreter- and compilation-specific metadata that\n    can differ between an imported function and the same freshly compiled source.\n    The source-freeze gate needs semantic identity instead: bytecode, exception\n    tables, signature/flags, referenced names and recursively hashed constants.\n    """\n    digest = hashlib.sha256()\n\n    def update_value(value: object) -> None:\n        if isinstance(value, CodeType):\n            digest.update(b"code\\0")\n            update_code(value)\n            return\n        if isinstance(value, tuple):\n            digest.update(b"tuple\\0")\n            for item in value:\n                update_value(item)\n                digest.update(b"\\0")\n            return\n        if isinstance(value, frozenset):\n            digest.update(b"frozenset\\0")\n            encoded_items = sorted(\n                f"{type(item).__qualname__}:{item!r}".encode(\n                    "utf-8", errors="backslashreplace"\n                )\n                for item in value\n            )\n            for item in encoded_items:\n                digest.update(item)\n                digest.update(b"\\0")\n            return\n        if isinstance(value, bytes):\n            digest.update(b"bytes\\0")\n            digest.update(value)\n            return\n        digest.update(type(value).__qualname__.encode("utf-8"))\n        digest.update(b":")\n        digest.update(repr(value).encode("utf-8", errors="backslashreplace"))\n\n    def update_code(item: CodeType) -> None:\n        for number in (\n            item.co_argcount,\n            item.co_posonlyargcount,\n            item.co_kwonlyargcount,\n            item.co_nlocals,\n            item.co_stacksize,\n            item.co_flags,\n        ):\n            digest.update(str(number).encode("ascii"))\n            digest.update(b"\\0")\n        digest.update(item.co_code)\n        digest.update(b"\\0")\n        digest.update(item.co_exceptiontable)\n        digest.update(b"\\0")\n        for values in (\n            item.co_names,\n            item.co_varnames,\n            item.co_freevars,\n            item.co_cellvars,\n        ):\n            update_value(tuple(values))\n            digest.update(b"\\0")\n        update_value(tuple(item.co_consts))\n\n    update_code(code)\n    return digest.hexdigest()\n'''
          if old_digest not in source:
              raise SystemExit('source-freeze digest anchor not found')
          source_path.write_text(source.replace(old_digest, new_digest, 1), encoding='utf-8')

          for name in (
              'research/registry/questions.yaml',
              'research/registry/hypotheses.yaml',
          ):
              p = Path(name)
              lines = p.read_text(encoding='utf-8').splitlines()
              while lines and not lines[-1].strip():
                  lines.pop()
              if lines and lines[-1].strip() == '-':
                  lines.pop()
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          p = Path('research/experiments/EXP-GEN-0021/AI_ANALYSIS_GPT-5.6-SOL.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip('\n') + '\n', encoding='utf-8')

          Path('.github/workflows/ci-main-cleanup-once.yml').unlink()
          PY
      - name: Run focused regression checks
        shell: bash
        run: |
          python -m pip install -e ".[dev,docs]" pre-commit
          python -m pytest -q tests/test_dashboard_experiment_workflow.py tests/test_scientific_execution_contract.py tests/test_exp21_operational_protocols.py tests/test_research_data_v2.py
          python -m pre_commit run --all-files --show-diff-on-failure
      - name: Commit cleanup to main
        shell: bash
        run: |
          git config user.name "Thomas Heisig"
          git config user.email "t_heisig@gmx.de"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "ci: align science fixtures and stabilize source freeze"
          git push origin HEAD:main
