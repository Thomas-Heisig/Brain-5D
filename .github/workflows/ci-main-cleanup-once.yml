name: CI Main Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-main-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Repair canonical test bindings and EOF hygiene
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/test_dashboard_experiment_workflow.py')
          text = path.read_text(encoding='utf-8')

          old_questions = (
              '        "- id: RQ-SNN-002\\n  domain: snn\\n  question: Does it link?\\n  relevance: test\\n",\n'
          )
          new_questions = (
              '        "- id: RQ-SNN-002\\n  domain: snn\\n  question: Does it link?\\n  relevance: test\\n"\n'
              '        "- id: RQ-TIME-001\\n  domain: timing\\n  question: Does timing scale?\\n  relevance: test\\n"\n'
              '        "- id: RQ-SUITE-001\\n  domain: research-infrastructure\\n  question: Does the suite execute?\\n  relevance: test\\n",\n'
          )
          if old_questions not in text:
              raise SystemExit('question registry fixture anchor not found')
          text = text.replace(old_questions, new_questions, 1)

          old_hypotheses = (
              '        "- id: H-SNN-001-A\\n  research_question: RQ-SNN-001\\n  hypothesis: It advances ticks.\\n",\n'
          )
          new_hypotheses = (
              '        "- id: H-SNN-001-A\\n  research_question: RQ-SNN-001\\n  hypothesis: It advances ticks.\\n"\n'
              '        "- id: H-SNN-002-A\\n  research_question: RQ-SNN-002\\n  hypothesis: It produces an impulse response.\\n"\n'
              '        "- id: H-TIME-001-A\\n  research_question: RQ-TIME-001\\n  hypothesis: Timing execution is measurable.\\n"\n'
              '        "- id: H-SUITE-001-A\\n  research_question: RQ-SUITE-001\\n  hypothesis: The registered suite executes consistently.\\n",\n'
          )
          if old_hypotheses not in text:
              raise SystemExit('hypothesis registry fixture anchor not found')
          text = text.replace(old_hypotheses, new_hypotheses, 1)

          bindings = {
              'EXP-PING-0001': ('RQ-SNN-002', 'H-SNN-002-A'),
              'EXP-GEN-0001': ('RQ-SNN-002', 'H-SNN-002-A'),
              'EXP-GEN-0002': ('RQ-SNN-002', 'H-SNN-002-A'),
              'EXP-GEN-0003': ('RQ-SNN-002', 'H-SNN-002-A'),
              'EXP-GEN-ALL-0001': ('RQ-SUITE-001', 'H-SUITE-001-A'),
              'EXP-MANUAL-0001': ('RQ-TIME-001', 'H-TIME-001-A'),
          }
          for experiment_id, (rq, hypothesis) in bindings.items():
              pattern = re.compile(
                  rf'("experiment_id": "{re.escape(experiment_id)}",\n'
                  rf'\s+"question_id": ")RQ-SNN-001(",\n'
                  rf'\s+"hypothesis_id": ")H-SNN-001-A(")'
              )
              text, count = pattern.subn(rf'\1{rq}\2{hypothesis}\3', text)
              expected = 2 if experiment_id == 'EXP-PING-0001' else 1
              if count != expected:
                  raise SystemExit(
                      f'{experiment_id}: expected {expected} binding replacements, got {count}'
                  )

          path.write_text(text, encoding='utf-8')

          for name in (
              'research/registry/questions.yaml',
              'research/registry/hypotheses.yaml',
          ):
              p = Path(name)
              lines = p.read_text(encoding='utf-8').splitlines()
              while lines and not lines[-1].strip():
                  lines.pop()
              if lines and lines[-1].strip() == '-':
                  lines.pop()
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          p = Path('research/experiments/EXP-GEN-0021/AI_ANALYSIS_GPT-5.6-SOL.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip('\n') + '\n', encoding='utf-8')

          Path('.github/workflows/ci-main-cleanup-once.yml').unlink()
          PY
      - name: Run focused regression checks
        shell: bash
        run: |
          python -m pip install -e ".[dev,docs]" pre-commit
          python -m pytest -q tests/test_dashboard_experiment_workflow.py tests/test_scientific_execution_contract.py tests/test_exp21_operational_protocols.py tests/test_research_data_v2.py
          python -m pre_commit run --all-files --show-diff-on-failure
      - name: Commit cleanup to main
        shell: bash
        run: |
          git config user.name "Thomas Heisig"
          git config user.email "t_heisig@gmx.de"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "ci: align legacy science fixtures with canonical protocols"
          git push origin HEAD:main
