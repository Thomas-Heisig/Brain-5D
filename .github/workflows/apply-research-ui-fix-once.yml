name: Apply Research UI Fix Once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-research-ui-fix-once.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply fixes
        run: python scripts/apply_research_ui_fix_20260906.py
      - name: Validate focused changes
        run: |
          python -m pip install -e '.[dev,docs]' pre-commit
          python -m black src/dashboard/experiment_workflow.py src/research/experiment_summary.py tests/test_scientific_execution_contract.py
          python -m ruff check src/dashboard/experiment_workflow.py src/research/experiment_summary.py tests/test_scientific_execution_contract.py
          python -m pytest -q tests/test_scientific_execution_contract.py tests/test_dashboard_experiment_workflow.py tests/test_dashboard_file_manager.py
          python -m mypy src/dashboard/experiment_workflow.py src/research/experiment_summary.py
          python -m pyright src/dashboard/experiment_workflow.py src/research/experiment_summary.py
      - name: Commit tested fixes
        run: |
          rm scripts/apply_research_ui_fix_20260906.py
          rm .github/workflows/apply-research-ui-fix-once.yml
          git config user.name 'Thomas Heisig'
          git config user.email 't_heisig@gmx.de'
          git add -A
          git commit -m 'research: fix execution parameters and popup reports'
          git push origin HEAD:main
# validation rerun 2
