name: Fix Research Parameter Defaults Once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-research-parameter-defaults-once.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply parameter-default fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/dashboard/static/experiment-workflow.js')
          text = p.read_text(encoding='utf-8')
          old = '''    if (operational) {\n      const currentSeeds = this.elements.seeds?.value;\n      const currentTicks = this.elements.ticks?.value;\n      this.elements.protocol.value = operational.id;\n      this._applyProtocol();\n      if (this.elements.seeds && currentSeeds) this.elements.seeds.value = currentSeeds;\n      if (this.elements.ticks && currentTicks) this.elements.ticks.value = currentTicks;\n      this._renderContract();\n      return;\n    }\n    if (questionId === "RQ-SNN-001" && this.elements.protocol.value === "science_suite_v1") {\n      // Long-term stability has no dedicated primary protocol yet. Use the complete\n      // suite as an executable diagnostic rather than aborting, while preserving\n      // the selected RQ/H and retaining MISMATCH evidence semantics server-side.\n      this.elements.protocol.value = "science_all_v1";\n      this.activePreset = null;\n      this._renderContract();\n    }\n'''
          new = '''    if (operational) {\n      // A newly selected RQ/protocol must load its frozen defaults. Stale values\n      // from the previously selected experiment must not silently survive. Users\n      // can still edit seeds/ticks explicitly after this contract has been loaded.\n      this.elements.protocol.value = operational.id;\n      this._applyProtocol();\n      this._renderContract();\n      return;\n    }\n    if (questionId === "RQ-SNN-001" && this.elements.protocol.value === "science_suite_v1") {\n      // Long-term stability has no dedicated primary protocol yet. Use the complete\n      // suite as an executable diagnostic rather than aborting, while preserving\n      // the selected RQ/H and retaining MISMATCH evidence semantics server-side.\n      this.elements.protocol.value = "science_all_v1";\n      this.activePreset = {\n        title: "Long-term stability diagnostic suite",\n        conditions: "Diagnostic bundle: PING/Recurrence, Temporal, STDP/Learning, TIME, 5D and Regulation. Not primary long-term stability evidence.",\n        ticks: "1000",\n        seeds: "42,43,44",\n        profiles: {\n          standard: "Seeds 42,43,44; complete diagnostic suite; RQ-SNN-001 remains evidence-blocked until a sustained-activity protocol exists.",\n        },\n      };\n      if (this.elements.title) this.elements.title.value = this.activePreset.title;\n      if (this.elements.ticks) this.elements.ticks.value = this.activePreset.ticks;\n      if (this.elements.seeds) this.elements.seeds.value = this.activePreset.seeds;\n      if (this.elements.conditionProfile) this.elements.conditionProfile.value = "standard";\n      this._applyConditionProfile(this.activePreset);\n      this._renderContract();\n    }\n'''
          if old not in text:
              raise SystemExit('Expected parameter-alignment block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate JavaScript modules
        run: |
          node --check src/dashboard/static/file-viewer.js
          node --check src/dashboard/static/experiment-workflow.js
          grep -q 'export async function openFMFile' src/dashboard/static/file-viewer.js
          grep -q 'import { openFMFile } from "./file-viewer.js"' src/dashboard/static/experiment-workflow.js
          grep -q 'this.elements.ticks.value = this.activePreset.ticks' src/dashboard/static/experiment-workflow.js
          grep -q 'this.elements.seeds.value = this.activePreset.seeds' src/dashboard/static/experiment-workflow.js
      - name: Commit tested fix
        run: |
          rm .github/workflows/fix-research-parameter-defaults-once.yml
          git config user.name 'Thomas Heisig'
          git config user.email 't_heisig@gmx.de'
          git add -A
          git commit -m 'research: apply protocol defaults on question selection'
          git push origin HEAD:main
