          if old not in text:
              raise SystemExit('condition stats target missing')
          text = text.replace(old, new, 1)

          # Rich temporal sparsity diagnostics.
          old = '''        temporal[horizon] = {\n            "discrepancy": _stats(horizon_values[horizon]),\n            "reference_comparisons": horizon_reference_counts[horizon],\n        }\n'''
          new = '''        horizon_all = horizon_values[horizon]\n        nonzero = [value for value in horizon_all if value != 0.0]\n        temporal[horizon] = {\n            "discrepancy": _stats(horizon_all),\n            "reference_comparisons": horizon_reference_counts[horizon],\n            "nonzero_comparisons": len(nonzero),\n            "nonzero_fraction": (len(nonzero) / len(horizon_all)) if horizon_all else 0.0,\n            "nonzero_discrepancy": _stats(nonzero),\n        }\n'''
          if old not in text:
              raise SystemExit('temporal stats target missing')
          text = text.replace(old, new, 1)

          # Prefer the already generated full statistics artifact so compressed raw runs do not
          # silently lose temporal statistics when summary is generated afterwards.
          old = '''    statistics = build_descriptive_statistics(runs)\n    statistics_path = write_statistics_artifact(experiment_dir, runs)\n'''
          new = '''    statistics_path = experiment_dir / "analysis" / "statistics.json"\n    stored_statistics = _read_json(statistics_path, None)\n    if isinstance(stored_statistics, dict) and stored_statistics.get("generated_by") == "deterministic_statistics_engine":\n        statistics = stored_statistics\n    else:\n        statistics = build_descriptive_statistics(runs)\n        statistics_path = write_statistics_artifact(experiment_dir, runs)\n'''
          if old not in text:
              raise SystemExit('canonical statistics target missing')
          text = text.replace(old, new, 1)

          # Suite semantic rule before fallback.
          marker = '''    if question_id.startswith("RQ-5D-"):\n        return classify(\n            {"1d", "2d", "3d", "5d", "random_graph"}.issubset(plain),\n            "5D erwartet die registrierten Dimensions-/Topologiebedingungen.",\n        )\n    return (\n'''
          replacement = '''    if question_id.startswith("RQ-5D-"):\n        return classify(\n            {"1d", "2d", "3d", "5d", "random_graph"}.issubset(plain),\n            "5D erwartet die registrierten Dimensions-/Topologiebedingungen.",\n        )\n    if question_id == "RQ-SUITE-001":\n        required_groups = {"ping", "temporal", "stdp", "learning", "time", "5d", "regulation"}\n        present_groups = {item.split(":", 1)[0] for item in conditions if ":" in item}\n        found = required_groups.issubset(present_groups) and protocol == "science_all_v1"\n        return (\n            "DIRECT_MATCH" if found else "MISMATCH",\n            "SUITE erwartet science_all_v1 und PING, TEMP, STDP, Learning, TIME, 5D sowie Regulation unter gemeinsamer Provenienz.",\n        )\n    if question_id == "RQ-SNN-001":\n        return (\n            "MISMATCH",\n            "RQ-SNN-001 fordert langfristig stabile Spike-Dynamik unter fortlaufender Aktivitaet. Ein einzelner Impuls bzw. science_all_v1 mit langer stiller Nachlaufphase ist dafuer keine ausreichende Primaerpruefung.",\n        )\n    return (\n'''
          if marker not in text:
              raise SystemExit('suite semantic insertion target missing')
          text = text.replace(marker, replacement, 1)

          # Replace old actual tick derivation by subgroup-aware view.
          old = '''    actual_ticks = [\n        int(value)\n        for run in runs\n        for value in [(run.get("metrics") or {}).get("ticks_executed")]\n        if isinstance(value, int)\n    ]\n'''
          new = '''    actual_ticks = [\n        int(value)\n        for run in runs\n        if str(run.get("condition", "")).startswith(("ping:", "temporal:", "5d:"))\n        for value in [(run.get("metrics") or {}).get("ticks_executed")]\n        if isinstance(value, int) and not isinstance(value, bool)\n    ]\n'''
          if old in text:
              text = text.replace(old, new, 1)

          # Add evidence readiness directly after semantic status.
          old = '''    semantic_status, semantic_note = _semantic_status(question_id, protocol, conditions)\n\n    requested_ticks = (\n'''
          new = '''    semantic_status, semantic_note = _semantic_status(question_id, protocol, conditions)\n    git_info = manifest.get("git", {}) if isinstance(manifest, dict) else {}\n    git_dirty = bool(git_info.get("dirty")) if isinstance(git_info, dict) else True\n    if semantic_status == "MISMATCH":\n        evidence_readiness = "BLOCKED_SEMANTIC_MISMATCH"\n    elif semantic_status == "NOT_AUTOMATICALLY_CLASSIFIED":\n        evidence_readiness = "BLOCKED_UNCLASSIFIED_SEMANTICS"\n    elif git_dirty:\n        evidence_readiness = "BLOCKED_DIRTY_SOURCE_TREE"\n    elif question_id == "RQ-SUITE-001":\n        evidence_readiness = "DIAGNOSTIC_ONLY"\n    else:\n        evidence_readiness = "HUMAN_REVIEW_REQUIRED"\n\n    requested_ticks = (\n'''
          if old not in text:
              raise SystemExit('evidence readiness insertion target missing')
          text = text.replace(old, new, 1)

          old = '''        f"- RQ/Condition-Pruefung: `{semantic_status}`",\n        f"- Begründung: {semantic_note}",\n'''
          new = '''        f"- RQ/Condition-Pruefung: `{semantic_status}`",\n        f"- Evidence Readiness: `{evidence_readiness}`",\n        f"- Begründung: {semantic_note}",\n'''
          if old not in text:
              raise SystemExit('semantic summary target missing')
          text = text.replace(old, new, 1)

          # Temporal section: make dilution visible.
          old = '''            lines.append(\n                f"- `{horizon}`: Referenzvergleiche={payload.get('reference_comparisons', 0) if isinstance(payload, dict) else 0}; discrepancy mean={_fmt(discrepancy.get('mean') if isinstance(discrepancy, dict) else None)}, max={_fmt(discrepancy.get('max') if isinstance(discrepancy, dict) else None)}."\n            )\n'''
          new = '''            nonzero = payload.get("nonzero_discrepancy", {}) if isinstance(payload, dict) else {}\n            lines.append(\n                f"- `{horizon}`: Referenzvergleiche={payload.get('reference_comparisons', 0) if isinstance(payload, dict) else 0}; discrepancy mean={_fmt(discrepancy.get('mean') if isinstance(discrepancy, dict) else None)}, max={_fmt(discrepancy.get('max') if isinstance(discrepancy, dict) else None)}; nonzero={payload.get('nonzero_comparisons', 0) if isinstance(payload, dict) else 0} ({_fmt(payload.get('nonzero_fraction') if isinstance(payload, dict) else None)}); mean(nonzero)={_fmt(nonzero.get('mean') if isinstance(nonzero, dict) else None)}."\n            )\n'''
          if old not in text:
              raise SystemExit('temporal summary target missing')
          text = text.replace(old, new, 1)

          # Add protocol-specific tables before individual runs.
          marker = '''    lines.extend(\n        [\n            "",\n            "## 6. Einzelne Läufe",\n'''
          extra = '''    condition_stats = statistics.get("conditions", {})\n    if isinstance(condition_stats, dict):\n        learning_rows = {k: v for k, v in condition_stats.items() if str(k).startswith(("learning:", "stdp:"))}\n        if learning_rows:\n            lines.extend(["", "### 5.4 Learning / STDP", "", "| Condition | n | Weight initial | Weight final | Delta weight | Success before | Success after | Rewards | Updates |", "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |"])\n            for condition, payload in learning_rows.items():\n                metrics = payload.get("metrics", {}) if isinstance(payload, dict) else {}\n                def lm(name: str) -> object:\n                    value = metrics.get(name, {}) if isinstance(metrics, dict) else {}\n                    return value.get("mean") if isinstance(value, dict) else None\n                lines.append(f"| {condition} | {payload.get('run_count', 0)} | {_fmt(lm('initial_mean_weight'))} | {_fmt(lm('final_mean_weight'))} | {_fmt(lm('mean_weight_delta'))} | {_fmt(lm('p_success_before'))} | {_fmt(lm('p_success_after'))} | {_fmt(lm('rewards_received'))} | {_fmt(lm('reward_weight_updates'))} |")\n\n        time_rows = {k: v for k, v in condition_stats.items() if str(k).startswith("time:")}\n        if time_rows:\n            lines.extend(["", "### 5.5 TIME-Durchsatz", "", "| Tick-Stufe | n | Dauer mean [s] | Ticks/s mean | Ticks/s std |", "| ---: | ---: | ---: | ---: | ---: |"])\n            for condition, payload in sorted(time_rows.items(), key=lambda item: int(str(item[0]).split(":", 1)[1])):\n                metrics = payload.get("metrics", {}) if isinstance(payload, dict) else {}\n                duration = metrics.get("duration_seconds", {}) if isinstance(metrics, dict) else {}\n                rate = metrics.get("ticks_per_second", {}) if isinstance(metrics, dict) else {}\n                lines.append(f"| {str(condition).split(':', 1)[1]} | {payload.get('run_count', 0)} | {_fmt(duration.get('mean') if isinstance(duration, dict) else None)} | {_fmt(rate.get('mean') if isinstance(rate, dict) else None)} | {_fmt(rate.get('std') if isinstance(rate, dict) else None)} |")\n\n        regulation_rows = {k: v for k, v in condition_stats.items() if str(k).startswith("regulation:")}\n        if regulation_rows:\n            lines.extend(["", "### 5.6 Regulation", "", "| Condition | Activation | Safety | Valence | Uncertainty | Resource pressure | Thermal margin |", "| --- | ---: | ---: | ---: | ---: | ---: | ---: |"])\n            for condition, payload in regulation_rows.items():\n                metrics = payload.get("metrics", {}) if isinstance(payload, dict) else {}\n                def rm(name: str) -> object:\n                    value = metrics.get(name, {}) if isinstance(metrics, dict) else {}\n                    return value.get("mean") if isinstance(value, dict) else None\n                lines.append(f"| {condition} | {_fmt(rm('functional_activation'))} | {_fmt(rm('functional_safety'))} | {_fmt(rm('functional_valence'))} | {_fmt(rm('functional_uncertainty'))} | {_fmt(rm('regulatory_resource_pressure'))} | {_fmt(rm('regulatory_thermal_margin'))} |")\n\n'''
          if marker not in text:
