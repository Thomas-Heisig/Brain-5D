name: EXP19 Scientific Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Apply EXP-0019 findings
        run: |
          python .github/scripts/exp19_hardening.py
          python .github/scripts/exp19_hardening_fix.py
      - name: Validate hardening
        run: |
          python -m pip install -e ".[dev]"
          python -m black src/dashboard/experiment_workflow.py src/research/experiment_summary.py tests/test_scientific_execution_contract.py .github/scripts/exp19_hardening.py .github/scripts/exp19_hardening_fix.py
          python -m ruff check src/dashboard/experiment_workflow.py src/research/experiment_summary.py tests/test_scientific_execution_contract.py .github/scripts/exp19_hardening.py .github/scripts/exp19_hardening_fix.py
          python -m pytest -q tests/test_scientific_execution_contract.py tests/test_experiment_suite.py tests/test_research_assistant_output_normalization.py
          python -m mypy src/dashboard/experiment_workflow.py src/research/experiment_summary.py
          python -m pyright src/dashboard/experiment_workflow.py src/research/experiment_summary.py tests/test_scientific_execution_contract.py
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/registry/questions.yaml research/registry/hypotheses.yaml src/dashboard/static/experiment-workflow.js src/dashboard/experiment_workflow.py src/research/experiment_summary.py tests/test_scientific_execution_contract.py
          git commit -m "feat: harden science suite provenance and reporting"
          git push origin HEAD:main
