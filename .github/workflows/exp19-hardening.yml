      - name: Validate hardening
        run: |
          python -m pip install -e ".[dev]"
          python -m black src/dashboard/experiment_workflow.py src/research/experiment_summary.py tests/test_scientific_execution_contract.py
          python -m ruff check src/dashboard/experiment_workflow.py src/research/experiment_summary.py tests/test_scientific_execution_contract.py
