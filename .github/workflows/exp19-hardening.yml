name: EXP19 Scientific Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Apply EXP-0019 findings
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Register an omnibus diagnostic RQ instead of abusing RQ-SNN-001.
          q = Path('research/registry/questions.yaml')
          text = q.read_text(encoding='utf-8')
          if 'RQ-SUITE-001' not in text:
              text += '''\n- id: RQ-SUITE-001\n  domain: Research Infrastructure\n  question: Erzeugt der vollstaendige Science-Suite-Lauf unter gemeinsamer Provenienz vollstaendige und intern konsistente Diagnoseartefakte fuer alle registrierten Teilprotokolle?\n  relevance: Trennt technische Omnibus-Validierung von hypothesenspezifischer wissenschaftlicher Evidenz.\n  literature: []\n  hypotheses:\n  - H-SUITE-001-A\n  evidence: []\n  status: open\n  answer:\n    current: null\n    confidence: none\n    limitations: Omnibus-Diagnostik ist keine Primaerevidenz fuer die enthaltenen Fach-RQs.\n  created: '2026-09-05'\n  updated: '2026-09-05'\n'''
              q.write_text(text, encoding='utf-8')

          h = Path('research/registry/hypotheses.yaml')
          text = h.read_text(encoding='utf-8')
          if 'H-SUITE-001-A' not in text:
              text += '''\n- id: H-SUITE-001-A\n  research_question: RQ-SUITE-001\n  hypothesis: Alle Science-Suite-Teilprotokolle erfuellen in einem gemeinsamen Lauf ihre registrierten Ausfuehrungsvertraege und erzeugen auswertbare DATA-, Statistik- und Provenienzartefakte.\n  status: untested\n  evidence: []\n  created: '2026-09-05'\n  updated: '2026-09-05'\n'''
              h.write_text(text, encoding='utf-8')

          # 2) Make the ALL preset scientifically honest.
          js = Path('src/dashboard/static/experiment-workflow.js')
          text = js.read_text(encoding='utf-8')
          text = text.replace(
              'question: "RQ-SNN-001",\n        hypothesis: "H-SNN-001-A",\n        title: "Complete science suite",',
              'question: "RQ-SUITE-001",\n        hypothesis: "H-SUITE-001-A",\n        title: "Complete science suite diagnostic",',
              1,
          )
          js.write_text(text, encoding='utf-8')

          # 3) Hardening of workflow: stale-process guard + compressed raw traces + full data digest.
          wf = Path('src/dashboard/experiment_workflow.py')
          text = wf.read_text(encoding='utf-8')
          text = text.replace('import hashlib\nimport json\n', 'import gzip\nimport hashlib\nimport json\nimport marshal\nimport re\n')

          needle = '''        runner = getattr(experiment_suite, runner_name)\n        tick_aware_runners = {\n'''
          replacement = '''        runner = getattr(experiment_suite, runner_name)\n        runtime_runner_digest, source_runner_digest = _assert_loaded_callable_matches_source(\n            runner, Path(experiment_suite.__file__).resolve(), runner_name\n        )\n        summary_runtime_digest, summary_source_digest = _assert_loaded_callable_matches_source(\n            write_detailed_experiment_summary,\n            Path(write_detailed_experiment_summary.__code__.co_filename).resolve(),\n            "write_detailed_experiment_summary",\n        )\n        tick_aware_runners = {\n'''
          if needle not in text:
              raise SystemExit('runner guard insertion target missing')
          text = text.replace(needle, replacement, 1)

          old = '''        serialized_runs = [asdict(run) for run in runs]\n        data_path.write_text(\n            json.dumps(serialized_runs, indent=2, sort_keys=True, default=list) + "\\n",\n            encoding="utf-8",\n        )\n        statistics_path = write_statistics_artifact(output_dir, serialized_runs)\n'''
          new = '''        serialized_runs = [asdict(run) for run in runs]\n        # Statistics are computed from the complete in-memory raw runs before bulky\n        # traces are externalized. The compact runs.json stays navigable even for\n        # 100k+ tick temporal experiments while the complete trace remains preserved.\n        statistics_path = write_statistics_artifact(output_dir, serialized_runs)\n        trace_paths = _externalize_large_traces(output_dir, serialized_runs)\n        data_path.write_text(\n            json.dumps(serialized_runs, indent=2, sort_keys=True, default=list) + "\\n",\n            encoding="utf-8",\n        )\n'''
          if old not in text:
              raise SystemExit('serialized runs target missing')
          text = text.replace(old, new, 1)

          old = '''        recorder.record_provenance_digests(\n            code_digest=_sha256_file(Path(experiment_suite.__file__)),\n            config_digest=config_digest,\n            prompt_digest=hashlib.sha256(b"NO_PROMPT").hexdigest(),\n            data_digest=_sha256_file(data_path),\n        )\n'''
          new = '''        recorder.record_provenance_digests(\n            code_digest=_sha256_file(Path(experiment_suite.__file__)),\n            config_digest=config_digest,\n            prompt_digest=hashlib.sha256(b"NO_PROMPT").hexdigest(),\n            data_digest=_sha256_files([data_path, *trace_paths]),\n        )\n'''
          if old not in text:
              raise SystemExit('provenance digest target missing')
          text = text.replace(old, new, 1)

          old = '''        manifest["execution_contract"] = {\n            "resolved_runner": runner_name,\n            "ticks_requested": workflow.ticks,\n            "tick_validation": tick_validation,\n            "question_id": workflow.question_id,\n            "hypothesis_id": workflow.hypothesis_id,\n            "protocol": workflow.protocol,\n        }\n'''
          new = '''        manifest["execution_contract"] = {\n            "resolved_runner": runner_name,\n            "ticks_requested": workflow.ticks,\n            "tick_validation": tick_validation,\n            "question_id": workflow.question_id,\n            "hypothesis_id": workflow.hypothesis_id,\n            "protocol": workflow.protocol,\n            "runtime_runner_bytecode_sha256": runtime_runner_digest,\n            "source_runner_bytecode_sha256": source_runner_digest,\n            "runtime_summary_bytecode_sha256": summary_runtime_digest,\n            "source_summary_bytecode_sha256": summary_source_digest,\n            "source_runtime_consistency": "MATCH",\n        }\n        if trace_paths:\n            artifacts["raw_trace_index"] = "DATA/traces/index.json"\n'''
          if old not in text:
              raise SystemExit('execution contract target missing')
          text = text.replace(old, new, 1)

          # Insert helper functions before YAML loader.
          marker = '\n\ndef _load_yaml(path: Path) -> dict[str, Any]:\n'
          helpers = r'''

def _find_named_code(code: object, name: str) -> object | None:
    if not hasattr(code, "co_consts"):
        return None
    if getattr(code, "co_name", None) == name:
        return code
    for value in code.co_consts:
        found = _find_named_code(value, name)
        if found is not None:
            return found
    return None


def _code_digest(code: object) -> str:
    return hashlib.sha256(marshal.dumps(code)).hexdigest()


def _assert_loaded_callable_matches_source(
    function: Callable[..., object], source_path: Path, function_name: str
) -> tuple[str, str]:
    """Refuse experiments when the running Python process still holds stale code."""
    runtime_digest = _code_digest(function.__code__)
    compiled = compile(source_path.read_text(encoding="utf-8"), str(source_path), "exec")
    source_code = _find_named_code(compiled, function_name)
    if source_code is None:
        raise WorkflowValidationError(
            f"Cannot verify runtime/source consistency for {function_name}."
        )
    source_digest = _code_digest(source_code)
    if runtime_digest != source_digest:
        raise WorkflowValidationError(
            f"Running process contains stale code for {function_name}. Restart the Brain-5D "
            "dashboard/runtime before creating a scientific experiment."
        )
    return runtime_digest, source_digest


def _safe_trace_name(condition: object, seed: object) -> str:
    label = re.sub(r"[^A-Za-z0-9_.-]+", "-", str(condition)).strip("-") or "trace"
    return f"{label}-seed-{seed}.jsonl.gz"


def _externalize_large_traces(
    output_dir: Path, serialized_runs: list[dict[str, Any]], threshold: int = 10_000
) -> list[Path]:
    """Preserve large per-tick traces compressed while keeping runs.json compact."""
    trace_dir = output_dir / "DATA" / "traces"
    trace_entries: list[dict[str, object]] = []
    written: list[Path] = []
    for run in serialized_runs:
        metrics = run.get("metrics")
        if not isinstance(metrics, dict):
            continue
        comparisons = metrics.get("comparisons")
        if not isinstance(comparisons, list) or len(comparisons) <= threshold:
            continue
        trace_dir.mkdir(parents=True, exist_ok=True)
        path = trace_dir / _safe_trace_name(run.get("condition"), run.get("seed"))
        with gzip.open(path, "wt", encoding="utf-8", newline="\n", compresslevel=9) as handle:
            for item in comparisons:
                handle.write(json.dumps(item, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
                handle.write("\n")
        digest = _sha256_file(path)
        count = len(comparisons)
        metrics["comparisons_artifact"] = {
            "path": path.relative_to(output_dir).as_posix(),
            "format": "jsonl.gz",
            "count": count,
            "sha256": digest,
        }
        metrics["comparisons_preview"] = comparisons[:8] + comparisons[-8:]
        del metrics["comparisons"]
        trace_entries.append(
            {
                "condition": run.get("condition"),
                "seed": run.get("seed"),
                "path": path.relative_to(output_dir).as_posix(),
                "count": count,
                "sha256": digest,
                "size_bytes": path.stat().st_size,
            }
        )
        written.append(path)
    if trace_entries:
        index_path = trace_dir / "index.json"
        index_path.write_text(
            json.dumps({"schema_version": "1.0", "traces": trace_entries}, indent=2, sort_keys=True)
            + "\n",
            encoding="utf-8",
        )
        written.append(index_path)
    return written


def _sha256_files(paths: Sequence[Path]) -> str:
    digest = hashlib.sha256()
    for path in sorted(paths, key=lambda item: item.as_posix()):
        digest.update(path.name.encode("utf-8"))
        digest.update(b"\0")
        digest.update(path.read_bytes())
        digest.update(b"\0")
    return digest.hexdigest()
'''
          if helpers.strip() not in text:
              if marker not in text:
                  raise SystemExit('helper insertion marker missing')
              text = text.replace(marker, helpers + marker, 1)
          wf.write_text(text, encoding='utf-8')

