name: Publish executed empirical campaign
on:
  push:
    branches: [research/empirical-evaluation-20260910]
    paths: [.github/workflows/publish-empirical.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: empirical-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Download completed original and amended observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34498445727 --repo Thomas-Heisig/MHRN --name empirical-campaign-data --dir "$RUNNER_TEMP/original"
          gh run download 34499633857 --repo Thomas-Heisig/MHRN --name scaling-amendment-data --dir "$RUNNER_TEMP/amended"
      - run: python -m pip install -e '.[dev,docs]'
      - name: Publish exact raw DATA and new manuscript edition
        run: |
          python .maintenance/finalize_empirical.py --original "$RUNNER_TEMP/original" --amended "$RUNNER_TEMP/amended"
          rm .maintenance/finalize_empirical.py
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path('scripts/empirical_campaign.py')
          path.write_text(path.read_text().replace('f"{plan["campaign"]}-{index + 1:03d}"', 'f"{plan[\'campaign\']}-{index + 1:03d}"'))
          folder = Path('research/publications/2026-09-10_recursive-epistemics_v1.4')
          full = folder / 'MANUSCRIPT.md'
          header = full.read_text(encoding='utf-8').split('\n\n---\n\n')[0]
          # Preserve only the publication header before the first inherited chapter.
          first = (folder / 'section-000.md').read_text(encoding='utf-8')
          header = full.read_text(encoding='utf-8').split(first, 1)[0]
          full.write_text(header + '\n\n---\n\n'.join(p.read_text(encoding='utf-8') for p in sorted(folder.glob('section-*.md'))), encoding='utf-8')
          from scripts.publication_empirical import load, save, sha
          manifest = load(folder / 'manifest.json')
          manifest['files']['MANUSCRIPT.md'] = {'sha256': sha(full), 'size': full.stat().st_size}
          save(folder / 'manifest.json', manifest)
          PY
          python -m black src tests scripts
          python -m ruff check src tests scripts
          python -m mypy src
          python -m pyright
          python -m pytest tests/test_empirical_evaluation.py tests/test_empirical_publication.py tests/test_mhrn_naming.py -q
          python scripts/publication_empirical.py --verify
      - name: Commit verified source, negative results and manuscript
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'MHRN empirical study (AI-assisted)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md HF_README.md project_identity.json pyproject.toml .pre-commit-config.yaml docs research src scripts tests .maintenance/finalize_empirical.py
          git diff --cached --check
          git commit -m 'research: publish 1287 observations, preserved failures and manuscript 1.4'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test -z "$(git status --porcelain)"
      - name: Execute complete source-bound baseline
        run: |
          python scripts/generate_baseline.py
          python scripts/check_doc_consistency.py --check-tests
          python scripts/publication_empirical.py --verify
      - name: Persist actual test results
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add tests/test_baseline.json research/generated/verification
          git diff --cached --quiet || git commit -m 'test: record genuinely executed empirical integration baseline'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Record diagnostics and readable source
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/publication-verification"
          git bundle create "$RUNNER_TEMP/publication-verification/source.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/publication-verification/HEAD.txt"
          git status --short > "$RUNNER_TEMP/publication-verification/status.txt"
          git diff --stat > "$RUNNER_TEMP/publication-verification/diff-stat.txt"
          cp tests/test_baseline.json "$RUNNER_TEMP/publication-verification/"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: empirical-publication-verification
          path: ${{ runner.temp }}/publication-verification/
          retention-days: 14
