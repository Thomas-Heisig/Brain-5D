name: Refresh current research reports

on:
  push:
    branches: [main]
    paths:
      - "research/registry/**"
      - "research/generate_reports.py"
      - "src/research/report_builder.py"
      - "src/research/registry.py"
      - "src/research/literature_registry.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-registry-reports-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install report dependencies
        run: python -m pip install -e .
      - name: Regenerate current reports only
        run: python research/generate_reports.py
      - name: Commit current reports without experiment history
        run: |
          git add research/generated
          git diff --cached --check
          git diff --cached --quiet || (
            git config user.name 'Brain-5D research reports'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: refresh current research reports'
            git push origin HEAD:main
          )
