name: Final Ruff source-freeze repair

on:
  push:
    branches:
      - fix/batch-20260910-ci-gates

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e '.[dev,docs]'
      - name: Repair and verify
        run: |
          python -m ruff check --fix src/research/experiment_recorder.py
          python -m black --check src tests scripts
          python -m ruff check src tests scripts
          python -m mypy src
      - name: Commit source repair without helper workflow
        run: |
          git config user.name 'MHRN CI Repair'
          git config user.email 'mhrn-ci-repair@users.noreply.github.com'
          git rm .github/workflows/fix-ruff-source-freeze.yml
          git add -A
          git commit -m 'style: restore canonical import order'
      - name: Refresh verified baseline
        run: python scripts/generate_baseline.py
      - name: Commit baseline and push
        run: |
          git add tests/test_baseline.json research/generated/verification || true
          git commit -m 'test: refresh source freeze after lint repair' || true
          git push origin HEAD:fix/batch-20260910-ci-gates
