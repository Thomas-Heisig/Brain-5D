name: Perfect Experiment Reporting v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  perfect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Patch final reporting contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('src/dashboard/static/index.html')
          text = index.read_text(encoding='utf-8')
          marker = '  <script type="module" src="/app.js"></script>\n'
          formula = '  <script type="module" src="/formula-renderer.js"></script>\n'
          if formula not in text:
              if marker not in text:
                  raise SystemExit('index script target missing')
              text = text.replace(marker, formula + marker, 1)
          index.write_text(text, encoding='utf-8')

          summary = Path('src/research/experiment_summary.py')
          text = summary.read_text(encoding='utf-8')
          start = text.index('def _semantic_status(')
          end = text.index('\n\ndef _fmt(', start)
          text = text[:start] + '''def _semantic_status(\n    question_id: str, protocol: str, conditions: set[str]\n) -> tuple[str, str]:\n    """Classify direct RQ tests separately from matching substudies in a suite."""\n    plain = {item.split(":", 1)[-1] for item in conditions}\n\n    def classify(found: bool, note: str) -> tuple[str, str]:\n        if not found:\n            return "MISMATCH", note\n        if protocol == "science_all_v1":\n            return (\n                "CONTAINS_MATCH",\n                note + " Die relevante Teilstudie ist in science_all_v1 enthalten; "\n                "nur diese Teilstudie ist primaer fuer die registrierte RQ auszuwerten.",\n            )\n        return "DIRECT_MATCH", note\n\n    if question_id.startswith("RQ-PING-"):\n        return classify(\n            {"recurrence_off", "recurrence_on"}.issubset(plain),\n            "PING erwartet recurrence_off und recurrence_on.",\n        )\n    if question_id.startswith("RQ-TEMP-"):\n        return classify(\n            "fast_medium_slow" in plain,\n            "TEMP erwartet fast_medium_slow mit FAST/MEDIUM/SLOW-Horizonten.",\n        )\n    if question_id.startswith("RQ-TIME-"):\n        time_conditions = {\n            item.split(":", 1)[1]\n            for item in conditions\n            if item.startswith("time:") and ":" in item\n        }\n        direct_conditions = {item for item in conditions if ":" not in item}\n        candidates = time_conditions or direct_conditions\n        return classify(\n            bool(candidates) and all(item.isdigit() for item in candidates),\n            "TIME erwartet numerische Tick-Leiter-Bedingungen.",\n        )\n    if question_id.startswith("RQ-5D-"):\n        return classify(\n            {"1d", "2d", "3d", "5d", "random_graph"}.issubset(plain),\n            "5D erwartet die registrierten Dimensions-/Topologiebedingungen.",\n        )\n    return (\n        "NOT_AUTOMATICALLY_CLASSIFIED",\n        "Keine automatische semantische Regel fuer diese RQ-Familie registriert.",\n    )\n''' + text[end:]

          old = '    semantic_status, semantic_note = _semantic_status(question_id, conditions)\n'
          new = '''    protocol = str(\n        simulation.get("protocol", workflow.get("protocol", "NOT_AVAILABLE"))\n        if isinstance(simulation, dict)\n        else workflow.get("protocol", "NOT_AVAILABLE")\n    )\n    semantic_status, semantic_note = _semantic_status(\n        question_id, protocol, conditions\n    )\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''        f"- Protokoll: `{simulation.get('protocol', workflow.get('protocol', 'NOT_AVAILABLE')) if isinstance(simulation, dict) else workflow.get('protocol', 'NOT_AVAILABLE')}`",\n'''
          if old in text:
              text = text.replace(old, '''        f"- Protokoll: `{protocol}`",\n''', 1)

          old = '''        f"- Tatsächlich ausgeführte Ticks je Lauf: `{min(actual_ticks) if actual_ticks else 'nicht direkt messbar'} .. {max(actual_ticks) if actual_ticks else 'nicht direkt messbar'}`",\n        f"- Tick-Vertrag: `{tick_contract}`",\n'''
          if old in text:
              text = text.replace(old, '''        f"- Tickgebundene SNN-Läufe (PING/TEMP/5D): `{min(actual_ticks) if actual_ticks else 'nicht direkt messbar'} .. {max(actual_ticks) if actual_ticks else 'nicht direkt messbar'}` ausgeführte Ticks",\n        f"- Tick-Vertrag: `{tick_contract}`",\n        "- TIME-Ladder: Der angeforderte Endpunkt wird je Seed separat validiert; Zwischenstufen duerfen kleiner sein.",\n        "- Trial-/Regulationsprotokolle: Interne Versuchszyklen sind nicht mit `ticks_executed` gleichzusetzen und werden nicht in die SNN-Tickspanne eingerechnet.",\n''', 1)

          old = '''        "Ein semantischer Mismatch blockiert die Nutzung des Laufs als Evidenz fuer die registrierte Forschungsfrage, auch wenn die technische Ausfuehrung fehlerfrei war.",\n'''
          if old in text:
              text = text.replace(old, '''        "`DIRECT_MATCH` bezeichnet einen gezielten RQ-spezifischen Lauf. `CONTAINS_MATCH` bedeutet, dass die passende Teilstudie innerhalb einer Gesamtsuite enthalten ist; nur diese Teilstudie ist primaer fuer die registrierte RQ auszuwerten. `MISMATCH` blockiert die Nutzung als Evidenz fuer die registrierte Forschungsfrage, auch wenn die technische Ausfuehrung fehlerfrei war.",\n''', 1)
          summary.write_text(text, encoding='utf-8')

          tests = Path('tests/test_scientific_execution_contract.py')
          text = tests.read_text(encoding='utf-8')
          directive = '# pyright: reportPrivateUsage=false\n'
          if directive not in text:
              text = directive + text
          if 'test_summary_semantics_distinguish_direct_and_contained_matches' not in text:
              text += '''\n\ndef test_summary_semantics_distinguish_direct_and_contained_matches() -> None:\n    from src.research.experiment_summary import _semantic_status\n\n    direct, _ = _semantic_status("RQ-TEMP-001", "science_suite_v1", {"fast_medium_slow"})\n    contained, _ = _semantic_status(\n        "RQ-TEMP-001", "science_all_v1",\n        {"ping:recurrence_off", "temporal:fast_medium_slow", "5d:5d"},\n    )\n    mismatch, _ = _semantic_status(\n        "RQ-TEMP-001", "science_suite_v1", {"recurrence_off", "recurrence_on"}\n    )\n    assert direct == "DIRECT_MATCH"\n    assert contained == "CONTAINS_MATCH"\n    assert mismatch == "MISMATCH"\n\n\ndef test_time_semantics_ignore_unrelated_science_all_conditions() -> None:\n    from src.research.experiment_summary import _semantic_status\n\n    status, _ = _semantic_status(\n        "RQ-TIME-001", "science_all_v1",\n        {"ping:recurrence_on", "time:100", "time:1000", "temporal:fast_medium_slow"},\n    )\n    assert status == "CONTAINS_MATCH"\n'''
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m pip install -e ".[dev]"
          python -m black src/research/experiment_summary.py tests/test_scientific_execution_contract.py
          python -m pytest -q tests/test_scientific_execution_contract.py tests/test_research_assistant_output_normalization.py
          python -m mypy src/research/experiment_summary.py
          python -m pyright src/research/experiment_summary.py tests/test_scientific_execution_contract.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/static/index.html src/research/experiment_summary.py tests/test_scientific_execution_contract.py
          git commit -m "feat: perfect experiment semantics and scientific formula viewer"
          git push origin HEAD:main
