name: Debug AIRR format

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Black
        run: python -m pip install black==26.5.1
      - name: Show exact Black diff
        run: python -m black --diff --check src/research/workflow_recovery.py tests/test_workflow_recovery.py
