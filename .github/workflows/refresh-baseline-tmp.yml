name: Refresh test baseline temporary
on:
  push:
    branches:
      - codex/complete-open-todos
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Regenerate verified baseline
        run: python scripts/generate_baseline.py
      - name: Verify docs consistency
        run: python scripts/check_doc_consistency.py --check-tests
      - name: Commit regenerated baseline
        run: |
          rm -f .github/workflows/refresh-baseline-tmp.yml .maintenance/baseline-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: refresh verified full-suite baseline'
          git push origin HEAD:codex/complete-open-todos
