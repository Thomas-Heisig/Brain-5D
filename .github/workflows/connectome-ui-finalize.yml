name: Verify reviewed connectome UI corrections

on:
  push:
    branches: [research/connectome-embodiment-20260909]
    paths: ['.github/workflows/connectome-ui-finalize.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connectome-ui-finalize
  cancel-in-progress: false

jobs:
  verification:
    if: github.ref == 'refs/heads/research/connectome-embodiment-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply only the three reviewed corrections and retire this helper
        run: |
          git config user.name 'MHRN research integration (AI-assisted)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          p = Path('src/dashboard/static/wesen-neural-symbiosis.js')
          text = p.read_text(encoding='utf-8')
          before = '<strong>Scientific boundary</strong>'
          after = '<strong>Scientific boundary / READ-ONLY view</strong>'
          if text.count(before) != 1:
              raise SystemExit('Reviewed UI precondition changed')
          p.write_text(text.replace(before, after), encoding='utf-8')
          for name in ('src/dashboard/static/wesen-profile.css', 'docs/02-architecture/PROFILE_IDENTITY.md'):
              p = Path(name)
              raw = p.read_bytes()
              if raw.endswith(b'\n'):
                  raise SystemExit('Reviewed EOF precondition changed: ' + name)
              p.write_bytes(raw + b'\n')
          PY
          git add src/dashboard/static/wesen-neural-symbiosis.js src/dashboard/static/wesen-profile.css docs/02-architecture/PROFILE_IDENTITY.md
          git rm .github/workflows/connectome-ui-finalize.yml
          git diff --cached --check
          git commit -m 'fix(ui): retain permanent read-only view boundary and normalize profile file endings'
      - name: Install canonical verification dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev,docs]' pre-commit
      - name: Verify all hooks and research integrity
        run: |
          python -m pre_commit run --all-files --show-diff-on-failure
          python scripts/check_connectome_integrity.py
          git diff --exit-code
          git diff --exit-code origin/main -- research/experiments research/registry/evidence research/publications/2026-09-07_ki-die-geliehene-intelligenz
      - name: Refresh genuine full-suite and deterministic artifacts
        run: |
          python scripts/generate_baseline.py
          python scripts/generate_determinism_artifact.py
          python research/generate_reports.py
          python scripts/generate_catalog_audit_report.py
          python scripts/check_doc_consistency.py --check-tests
          python scripts/publication_bundle.py
          python scripts/publication_revision.py
          python scripts/publication_cognition.py
          python scripts/publication_naming.py
          git add tests/test_baseline.json research/generated
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'test: refresh genuine verification after browser-contract correction'
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Publish verified commits if this token permits workflow retirement
        continue-on-error: true
        run: git push origin HEAD:refs/heads/research/connectome-embodiment-20260909
      - name: Export exact commits for authorized publication and audit
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/connectome-final-ui"
          git bundle create "$RUNNER_TEMP/connectome-final-ui/repository.bundle" --all
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/connectome-final-ui/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/connectome-final-ui/HEAD.txt"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/connectome-final-ui/status.txt"
          git diff HEAD > "$RUNNER_TEMP/connectome-final-ui/uncommitted.patch"
          cp tests/test_baseline.json "$RUNNER_TEMP/connectome-final-ui/test-baseline.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: connectome-final-ui
          path: ${{ runner.temp }}/connectome-final-ui/
          retention-days: 7
