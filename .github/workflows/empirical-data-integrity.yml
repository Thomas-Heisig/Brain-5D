name: Empirical DATA and manuscript integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  empirical-data-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,docs]'
      - name: Verify immutable observations, failed attempts and 61 chapters
        run: |
          python scripts/publication_empirical.py --verify
          python -m pytest tests/test_empirical_evaluation.py tests/test_empirical_publication.py -q
          git diff --exit-code -- research/publications research/experiments
