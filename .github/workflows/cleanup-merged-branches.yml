name: Cleanup merged branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete verified merged remote branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "docs/philosophical-claims-roadmap"
            "docs/recursive-loopback-integration"
            "feat/dashboard-experience-makeover"
            "feat/dashboard-responsive-workspaces"
            "feat/embodiment-real-body"
            "feature/learning-preparation-studio-foundation"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
