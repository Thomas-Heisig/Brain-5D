name: v0.6 temporary diagnostics

on:
  push:
    branches: [work/research-ui-v06-todo-cleanup]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev,docs]'
      - name: Autoformat modified Python files
        run: |
          python -m black \
            src/dashboard/experiment_archive.py \
            src/dashboard/research_source.py \
            src/diagnostics/performance_contract.py \
            src/storage/v06_contract.py \
            scripts/benchmark_ladder.py \
            tests/test_experiment_archive.py \
            tests/test_research_workspace_v06.py \
            tests/test_v06_contract.py \
            tests/test_v06_pause_resume_identity.py
          python -m ruff check --fix \
            src/dashboard/experiment_archive.py \
            src/dashboard/research_source.py \
            src/diagnostics/performance_contract.py \
            src/storage/v06_contract.py \
            scripts/benchmark_ladder.py \
            tests/test_experiment_archive.py \
            tests/test_research_workspace_v06.py \
            tests/test_v06_contract.py \
            tests/test_v06_pause_resume_identity.py
      - name: Capture focused diagnostics
        run: |
          mkdir -p .ci-v06
          python -m mypy src/ > .ci-v06/mypy.log 2>&1 || true
          python -m pytest \
            tests/test_experiment_archive.py \
            tests/test_research_workspace_v06.py \
            tests/test_v06_contract.py \
            tests/test_v06_pause_resume_identity.py \
            -q -ra > .ci-v06/pytest.log 2>&1 || true
      - name: Commit formatting and diagnostic logs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/dashboard/experiment_archive.py \
            src/dashboard/research_source.py \
            src/diagnostics/performance_contract.py \
            src/storage/v06_contract.py \
            scripts/benchmark_ladder.py \
            tests/test_experiment_archive.py \
            tests/test_research_workspace_v06.py \
            tests/test_v06_contract.py \
            tests/test_v06_pause_resume_identity.py \
            .ci-v06
          if git diff --cached --quiet; then
            echo 'No diagnostic changes to commit'
          else
            git commit -m 'ci: capture v0.6 diagnostics and formatting'
            git push
          fi
