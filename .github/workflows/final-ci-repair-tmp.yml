name: Final CI repair temporary
on:
  push:
    branches:
      - codex/complete-open-todos
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Apply targeted fixes
        run: |
          python .maintenance/fix_final_ci.py
          python .maintenance/fix_pyright_last.py
          python -m ruff check --fix src/dashboard/experiment_workflow.py tests/test_msba_experiment_runner.py tests/test_file_rendering.py src/dashboard/file_rendering.py
          python -m black src/dashboard/experiment_workflow.py tests/test_msba_experiment_runner.py tests/test_file_rendering.py src/dashboard/file_rendering.py
      - name: Verify lint and types
        run: |
          python -m ruff check src/ tests/ scripts/
          python -m mypy src/
          python -m pyright
      - name: Verify focused and browser-source contracts
        run: |
          python -m pytest tests/test_file_rendering.py tests/test_msba_experiment_runner.py -q
          node --check src/dashboard/static/file-renderer.js
          node --check src/dashboard/static/bibtex-viewer.js
          git diff --check
      - name: Regenerate verified baseline on final source tree
        run: python scripts/generate_baseline.py
      - name: Verify documentation consistency
        run: python scripts/check_doc_consistency.py --check-tests
      - name: Commit final repair and baseline
        run: |
          rm -f .github/workflows/final-ci-repair-tmp.yml .github/workflows/refresh-baseline-tmp.yml .maintenance/fix_final_ci.py .maintenance/fix_pyright_last.py .maintenance/baseline-trigger.txt .maintenance/final-repair-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): close lint type and baseline gates'
          git push origin HEAD:codex/complete-open-todos
