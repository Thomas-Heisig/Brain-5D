name: Repository repair and verification

on:
  push:
    branches: [main]
    paths: ['.maintenance/**', '.github/workflows/repository-maintenance.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repository-maintenance-main
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply reviewed refinement without overwriting newer work
        run: |
          git config user.name 'Brain-5D maintenance (AI-assisted)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat .maintenance/refinement-*.patch > "$RUNNER_TEMP/refinement.patch"
          if git apply --reverse --check "$RUNNER_TEMP/refinement.patch" 2>/dev/null; then
            echo 'Refinement already applied'
          else
            git apply --check "$RUNNER_TEMP/refinement.patch"
            git apply "$RUNNER_TEMP/refinement.patch"
          fi
          git add .gitattributes .github/workflows/ci.yml .github/workflows/sync-huggingface.yml .huggingface/lfs.gitattributes .pre-commit-config.yaml scripts/generate_baseline.py src tests/test_catalog_status.py tests/test_file_rendering.py
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'fix: authorize file changes, complete chat rendering and catalog facets, preserve clean checkouts'
          git reset --hard HEAD
      - name: Install verification tools
        run: python -m pip install -e '.[dev,docs,browser]'
      - name: Verify code style and types
        run: |
          python -m black --check src tests scripts
          python -m ruff check src tests scripts
          python -m mypy src
          python -m pyright
          python -c "from pathlib import Path; import yaml; [yaml.safe_load(p.read_text()) for p in Path('.github/workflows').glob('*.yml')]"
      - name: Produce genuine test and determinism artifacts
        run: |
          python scripts/generate_baseline.py
          python scripts/generate_determinism_artifact.py
          python research/generate_reports.py
          python scripts/generate_catalog_audit_report.py
          python scripts/check_doc_consistency.py --check-tests
      - name: Commit verified current artifacts and publish without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add tests/test_baseline.json research/generated
          git diff --cached --check
          git diff --cached --quiet || git commit -m 'test: refresh source-bound baseline and current catalog review status'
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
      - name: Export verification source and diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/verification-source"
          git bundle create "$RUNNER_TEMP/verification-source/repository.bundle" --all
          git diff > "$RUNNER_TEMP/verification-source/uncommitted.patch"
          git status --short > "$RUNNER_TEMP/verification-source/tree-status.txt"
          git log -5 --format='%H %s' > "$RUNNER_TEMP/verification-source/commits.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-source
          path: ${{ runner.temp }}/verification-source/
          retention-days: 3
