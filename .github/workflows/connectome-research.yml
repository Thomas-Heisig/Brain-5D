name: Connectome research integrity

on:
  push:
    branches: [main, research/connectome-embodiment-20260909]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectome-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared development dependencies
        run: python -m pip install -e '.[dev,docs]'
      - name: Verify design, source and authority boundaries
        run: |
          python scripts/check_connectome_integrity.py
          python -m pytest -q tests/test_connectome_embodiment.py tests/test_exp21_operational_protocols.py
      - name: Execute actual native screens through the existing workflow
        run: python scripts/run_connectome_smoke.py --output "$RUNNER_TEMP/connectome-smoke"
      - name: No scientific history or source mutation
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: connectome-engineering-smoke
          path: ${{ runner.temp }}/connectome-smoke/
          retention-days: 14
