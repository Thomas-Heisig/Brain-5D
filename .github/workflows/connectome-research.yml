name: Connectome research integrity

on:
  push:
    branches: [research/connectome-embodiment-20260909]
    paths: ['.github/workflows/connectome-research.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Collect pinned verification tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          python -m pip download -d "$RUNNER_TEMP/tools" black==26.5.1 ruff==0.16.6 mypy==2.3.1 pyright==1.1.411 pylint==4.0.8 types-PyYAML types-psutil bandit
      - uses: actions/upload-artifact@v7
        with:
          name: connectome-verification-tools
          path: ${{ runner.temp }}/tools/
          retention-days: 1
