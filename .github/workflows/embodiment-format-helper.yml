name: Embodiment Format Helper

on:
  push:
    branches:
      - feat/embodiment-real-body

permissions:
  contents: read

jobs:
  format:
    if: github.event.head_commit.message == 'ci: add temporary embodiment format helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install exact formatter
        run: python -m pip install black==26.5.1
      - name: Format changed Python files
        run: |
          python -m black src/embodiment/system_sensor.py src/embodiment/real_body.py tests/test_embodiment_real_body.py
      - name: Pack formatted sources
        run: |
          mkdir -p formatted/src/embodiment formatted/tests
          cp src/embodiment/system_sensor.py formatted/src/embodiment/
          cp src/embodiment/real_body.py formatted/src/embodiment/
          cp tests/test_embodiment_real_body.py formatted/tests/
      - uses: actions/upload-artifact@v7
        with:
          name: embodiment-black-formatted
          path: formatted
