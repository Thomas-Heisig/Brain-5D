name: Refresh v0.6 source-bound baseline

on:
  push:
    branches: [work/research-ui-v06-todo-cleanup]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev,docs]'
      - name: Generate verified baseline
        run: python scripts/generate_baseline.py
      - name: Commit verified baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_baseline.json
          if git diff --cached --quiet; then
            echo 'Baseline already current'
          else
            git commit -m 'test: refresh verified v0.6 baseline'
            git push
          fi
