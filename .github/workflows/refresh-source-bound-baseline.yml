name: Refresh source-bound baseline

on:
  push:
    branches: [tmp-baseline-refresh]
    paths:
      - ".github/workflows/refresh-source-bound-baseline.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: tmp-baseline-refresh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Generate honest source-bound baseline
        run: python scripts/generate_baseline.py
      - name: Commit refreshed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_baseline.json
          git diff --cached --quiet && exit 0
          git commit -m "test: refresh source-bound baseline"
          git push origin HEAD:tmp-baseline-refresh
