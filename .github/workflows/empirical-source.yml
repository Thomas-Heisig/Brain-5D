name: Empirical evaluation source snapshot
on:
  push:
    branches: [research/empirical-evaluation-20260910]
    paths: [.github/workflows/empirical-source.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export immutable public source
        run: |
          mkdir -p "$RUNNER_TEMP/empirical-source"
          git bundle create "$RUNNER_TEMP/empirical-source/repository.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/empirical-source/HEAD.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: empirical-source
          path: ${{ runner.temp }}/empirical-source/
          retention-days: 3
