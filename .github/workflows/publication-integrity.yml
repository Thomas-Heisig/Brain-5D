name: Publication Integrity

on:
  push:
    branches: [main]
    paths:
      - 'research/publications/**'
      - 'scripts/publication_bundle.py'
      - 'scripts/browser_server.py'
      - 'src/dashboard/**'
      - 'tests/test_publication_integration.py'
      - 'tests/browser/publication.spec.js'
      - '.pre-commit-config.yaml'
      - '.github/workflows/publication-integrity.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Materialize publication LFS objects
        run: git lfs pull --include='research/publications/**' --exclude=''
      - name: Verify original files, complete archive and complete reader
        run: python scripts/publication_bundle.py
      - name: Install project test tools
        run: python -m pip install -e '.[dev,docs]'
      - name: Publication integration regression tests
        run: python -m pytest tests/test_publication_integration.py tests/test_dashboard_file_manager.py -q
      - name: Ensure verification does not rewrite scientific artifacts
        run: git diff --exit-code -- research/publications
