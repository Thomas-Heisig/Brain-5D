name: EXP21 registry cleanup

on:
  push:
    branches:
      - research/data-v2-and-operational-rqs

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[registry-cleaned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply registry cleanup
        run: python scripts/fix_exp21_registry_promotion.py
      - name: Verify canonical registry smoke tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_research_registry.py tests/test_exp21_operational_protocols.py -q
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git config user.name "Brain-5D Research Automation"
          git config user.email "actions@users.noreply.github.com"
          git add research/registry/questions.yaml research/registry/hypotheses.yaml research/protocols/EXP_GEN_0021_OPERATIONAL_PROTOCOLS.json research/preregistrations src/research/experiment_summary.py tests/test_exp21_operational_protocols.py scripts/apply_exp21_operationalization.py
          git commit -m "research: normalize promoted EXP-GEN-0021 IDs [registry-cleaned]"
          git push origin HEAD:research/data-v2-and-operational-rqs
