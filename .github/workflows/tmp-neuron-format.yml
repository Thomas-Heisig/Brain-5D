name: Temporary Neuron Formatter

on:
  push:
    branches:
      - feature/single-neuron-model-contract

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/single-neuron-model-contract
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Black
        run: python -m pip install black==26.5.1
      - name: Fix typing and format neuron files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/core/neuron.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from typing import Any, Callable',
              'from typing import Any, Callable, cast',
          )
          text = text.replace(
              'config = NeuronConfig.from_dict(config_data)',
              'config = NeuronConfig.from_dict(cast(dict[str, Any], config_data))',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m black src/core/neuron.py src/core/neuron_models.py tests/test_single_neuron_contract.py
      - name: Commit formatted source and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-neuron-format.yml
          git add src/core/neuron.py src/core/neuron_models.py tests/test_single_neuron_contract.py
          git commit -m "fix(neuron): satisfy formatter and pyright"
          git push origin HEAD:feature/single-neuron-model-contract
