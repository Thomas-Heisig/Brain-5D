# ============================================================================
# Brain-5D — optional GitHub -> Hugging Face mirror
# ============================================================================
# The GitHub repository is canonical. The mirror runs after pushes to main only
# when both HF_USERNAME and HF_TOKEN are configured as Actions secrets.
# Missing mirror credentials are not a failure of Brain-5D itself.
# ============================================================================

name: Sync to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face when configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_REPO: Brain-5D
          HF_SPACE_REPO: Brain-5D-Space
        run: |
          set -e

          if [ -z "${HF_USERNAME}" ] || [ -z "${HF_TOKEN}" ]; then
            echo "::notice::Hugging Face mirror is not configured; skipping optional sync."
            exit 0
          fi

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Hugging Face rejects binary blobs in older Git history. Publish a
          # fresh source snapshot so every current binary passes the LFS filter.
          mirror_dir="$(mktemp -d)"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a {} "$mirror_dir"/ \;
          if [ -f "$mirror_dir/HF_README.md" ]; then
            cp "$mirror_dir/HF_README.md" "$mirror_dir/README.md"
          fi

          cp "$mirror_dir/.huggingface/lfs.gitattributes" "$mirror_dir/.gitattributes"

          git -C "$mirror_dir" init --initial-branch=main
          git -C "$mirror_dir" lfs install --local
          git -C "$mirror_dir" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$mirror_dir" config user.name "github-actions[bot]"
          git -C "$mirror_dir" remote add huggingface \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/${HF_USERNAME}/${HF_REPO}"
          git -C "$mirror_dir" remote add huggingface-space \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_REPO}"
          git -C "$mirror_dir" add --all --force
          git -C "$mirror_dir" commit -m "Sync: mirror GitHub main"

          git -C "$mirror_dir" push huggingface HEAD:main --force
          git -C "$mirror_dir" lfs push --all huggingface HEAD
          git -C "$mirror_dir" push huggingface-space HEAD:main --force
          git -C "$mirror_dir" lfs push --all huggingface-space HEAD
