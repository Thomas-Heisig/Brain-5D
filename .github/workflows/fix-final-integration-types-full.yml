name: Fix final integration typing full env

on:
  push:
    branches:
      - fix/final-integration-20260911
    paths:
      - .github/integration/typefix-full-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply typed Runtime I/O contract fix
        shell: python
        run: |
          from pathlib import Path

          runtime = Path("src/controller/runtime.py")
          text = runtime.read_text(encoding="utf-8")
          needle = "    def step(self) -> StepResultLike: ...\n\n\nclass HomeostasisLike(Protocol):"
          replacement = "    def step(self) -> StepResultLike: ...\n\n    def is_input_cell(self, neuron_id: int) -> bool: ...\n\n    def inject_current(self, neuron_id: int, current: float) -> None: ...\n\n\nclass HomeostasisLike(Protocol):"
          if needle in text:
              runtime.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          elif "def is_input_cell(self, neuron_id: int) -> bool" not in text:
              raise SystemExit("RuntimeNetworkLike insertion point not found")

          server = Path("src/dashboard/server.py")
          text = server.read_text(encoding="utf-8")
          text = text.replace(
              '        before_outputs = {\n            str(output_id): self._runtime_io_neuron_state(network, output_id)\n',
              '        before_outputs: dict[str, JSONValue] = {\n            str(output_id): cast(\n                JSONValue, self._runtime_io_neuron_state(network, output_id)\n            )\n',
              1,
          )
          text = text.replace(
              '        after_outputs = {\n            str(output_id): self._runtime_io_neuron_state(network, output_id)\n',
              '        after_outputs: dict[str, JSONValue] = {\n            str(output_id): cast(\n                JSONValue, self._runtime_io_neuron_state(network, output_id)\n            )\n',
              1,
          )
          text = text.replace(
              '                    "input_v": float(after_input["v"]) - float(before_input["v"]),\n                    "input_u": float(after_input["u"]) - float(before_input["u"]),\n',
              '                    "input_v": cast(float, after_input["v"])\n                    - cast(float, before_input["v"]),\n                    "input_u": cast(float, after_input["u"])\n                    - cast(float, before_input["u"]),\n',
              1,
          )
          server.write_text(text, encoding="utf-8")
      - name: Install full development environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,docs]"
      - name: Format and verify types
        run: |
          python -m black src/controller/runtime.py src/dashboard/server.py
          python -m mypy src
          python -m pyright src
      - name: Remove one-shot plumbing
        if: success()
        run: |
          rm -f .github/integration/typefix-trigger .github/integration/typefix-full-trigger .github/integration/verify-trigger
          rm -f .github/workflows/fix-final-integration-types.yml .github/workflows/fix-final-integration-types-full.yml .github/workflows/verify-final-integration.yml
      - name: Commit type-safe fix
        if: success()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: type Runtime I/O contract"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
