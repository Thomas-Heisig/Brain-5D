# Hooks use the same pinned development tools as CI; no formatter version drift.
repos:
  - repo: local
    hooks:
      - id: black
        name: black (canonical toolchain)
        entry: python -m black --check src tests scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff
        name: ruff (canonical toolchain)
        entry: python -m ruff check src tests scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy (full src)
        entry: python -m mypy src/
        language: system
        pass_filenames: false
        types: [python]
      - id: pyright
        name: pyright (strict source and tests)
        entry: python -m pyright
        language: system
        pass_filenames: false
        types: [python]
  # Trailing whitespace, EOF newline, merge conflicts
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        # Frozen experiment manifests are evidence artifacts and must not be
        # byte-rewritten by an automatic formatting hook.
        exclude: ^research/(experiments/|registry/evidence/|generated/data/|generated/verification/)
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
