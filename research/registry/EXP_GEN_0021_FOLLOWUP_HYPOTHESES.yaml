# Proposed hypotheses derived from EXP-GEN-0021.
# AI-assisted proposal only; human review required before promotion into hypotheses.yaml.

- id: H-REC-001-A
  research_question: RQ-REC-001
  hypothesis: Increasing recurrent weight and/or shortening recurrent delay produces a reproducible transition from immediate decay through transient recurrence to sustained recurrent activity within bounded parameter regions.
  status: proposed
  source_experiment: EXP-GEN-0021
  created: '2026-09-05'

- id: H-REC-002-A
  research_question: RQ-REC-002
  hypothesis: Recurrence lifetime and extinction dynamics change systematically with loop length, network size and recurrent branching even when total synaptic drive is controlled.
  status: proposed
  source_experiment: EXP-GEN-0021
  created: '2026-09-05'

- id: H-GEN-001-A
  research_question: RQ-GEN-001
  hypothesis: Reward-modulated local learning improves held-out and perturbation-holdout behavioral performance relative to learning-off and sham-replay controls.
  status: proposed
  source_experiment: EXP-GEN-0021
  created: '2026-09-05'

- id: H-REPL-001-A
  research_question: RQ-REPL-001
  hypothesis: The recurrence and productive-learning effects observed in EXP-GEN-0021 remain directionally consistent under independent initial states, topology instances and clean-process execution.
  status: proposed
  source_experiment: EXP-GEN-0021
  created: '2026-09-05'

- id: H-5D-005-A
  research_question: RQ-5D-005
  hypothesis: At least one propagation, robustness, learning-efficiency or motif metric differs between 5D geometry and topology-matched lower-dimensional/shuffled controls when graph-level confounders are held constant.
  status: proposed
  source_experiment: EXP-GEN-0021
  created: '2026-09-05'

- id: H-REG-002-A
  research_question: RQ-REG-002
  hypothesis: Closed-loop regulation reduces activity collapse and recovery time after matched perturbations compared with regulation-disabled controls.
  status: proposed
  source_experiment: EXP-GEN-0021
  created: '2026-09-05'

- id: H-TEMP-002-A
  research_question: RQ-TEMP-002
  hypothesis: Brain-5D produces distinguishable spike-response signatures for original temporal sequences versus shuffled and reversed controls with identical marginal event statistics.
  status: proposed
  source_experiment: EXP-GEN-0021
  created: '2026-09-05'

- id: H-PERF-001-A
  research_question: RQ-PERF-001
  hypothesis: Temporal statistics, serialization/storage and observability overhead account for a larger fraction of complete Science Suite wall time than the isolated SNN tick loop at the EXP-GEN-0021 scale.
  status: proposed
  source_experiment: EXP-GEN-0021
  created: '2026-09-05'

- id: H-LEARN-INTERF-001-A
  research_question: RQ-LEARN-INTERF-001
  hypothesis: Sequential task acquisition causes measurable retention loss in earlier tasks unless homeostatic and/or structural mechanisms are enabled under matched conditions.
  status: proposed
  source_experiment: EXP-GEN-0021
  created: '2026-09-05'
