- id: RQ-REC-001
  domain: Recurrent Dynamics
  question: Under which recurrent weights and delays does Brain-5D transition from immediate decay to transient recurrent activity and to stable self-sustained activity?
  relevance: EXP-GEN-0021 showed a reproducible recurrence-dependent increase in spikes, synaptic events, recurrent events and propagation depth, but the activity eventually decayed.
  source_experiment: EXP-GEN-0021
  proposed_hypothesis: H-REC-001-A
  status: proposed
  created: '2026-09-05'

- id: RQ-GEN-001
  domain: Learning Generalization
  question: Does reward-modulated local learning improve performance on held-out and perturbed conditions that were not used during adaptation?
  relevance: EXP-GEN-0021 showed functional change in learning-on that was absent in learning-off and sham-replay controls, but did not establish generalization.
  source_experiment: EXP-GEN-0021
  proposed_hypothesis: H-GEN-001-A
  status: proposed
  created: '2026-09-05'

- id: RQ-REPL-001
  domain: Replication
  question: Do the recurrence and productive-learning effects survive independent initializations, clean-process execution and supported runtime environments?
  relevance: Identical multi-seed trajectories in EXP-GEN-0021 demonstrate determinism under those conditions, not independent statistical replication.
  source_experiment: EXP-GEN-0021
  proposed_hypothesis: H-REPL-001-A
  status: proposed
  created: '2026-09-05'

- id: RQ-5D-005
  domain: 5D Topology
  question: Does five-dimensional geometry change propagation, robustness, learning efficiency or motif formation when neuron count, synapse count, degree distribution, weights and stimulus schedule are matched?
  relevance: The small dimensional conditions in EXP-GEN-0021 produced indistinguishable macroscopic propagation metrics and therefore did not isolate a 5D-specific functional effect.
  source_experiment: EXP-GEN-0021
  proposed_hypothesis: H-5D-005-A
  status: proposed
  created: '2026-09-05'

- id: RQ-REG-002
  domain: Closed-loop Regulation
  question: Does active homeostatic/interoceptive regulation improve SNN stability and recovery after matched resource or sensor perturbations compared with regulation-disabled controls?
  relevance: EXP-GEN-0021 validated nominal, chronic-pressure and unknown-telemetry transforms, but did not establish a functional closed-loop benefit.
  source_experiment: EXP-GEN-0021
  proposed_hypothesis: H-REG-002-A
  status: proposed
  created: '2026-09-05'

- id: RQ-TEMP-002
  domain: Temporal Learning
  question: Can Brain-5D exploit temporal order in spike-carrying tasks and distinguish original sequences from shuffled or reversed controls?
  relevance: EXP-GEN-0021 measured horizon-dependent continuous-state discrepancy but its temporal condition reported no spikes and therefore did not demonstrate spike-based temporal representation.
  source_experiment: EXP-GEN-0021
  proposed_hypothesis: H-TEMP-002-A
  status: proposed
  created: '2026-09-05'

- id: RQ-PERF-001
  domain: Runtime Performance
  question: Which subsystems dominate Science Suite wall time, and which optimizations improve throughput while preserving deterministic simulation equivalence?
  relevance: EXP-GEN-0021 showed a large difference between isolated tick throughput and complete suite wall time, motivating subsystem-resolved profiling.
  source_experiment: EXP-GEN-0021
  proposed_hypothesis: H-PERF-001-A
  status: proposed
  created: '2026-09-05'

- id: RQ-REC-002
  domain: Recurrent Dynamics
  question: How do network size, loop length and recurrent branching change recurrence lifetime, inter-spike-interval dynamics and extinction behavior?
  relevance: The three-neuron recurrence loop in EXP-GEN-0021 is too small to determine whether the observed decay law generalizes to larger recurrent structures.
  source_experiment: EXP-GEN-0021
  proposed_hypothesis: H-REC-002-A
  status: proposed
  created: '2026-09-05'

- id: RQ-LEARN-INTERF-001
  domain: Lifelong Learning
  question: Does sequential reward-modulated learning preserve earlier learned behavior, or does interference emerge as additional tasks are learned?
  relevance: The positive productive-learning signal in EXP-GEN-0021 motivates testing retention and catastrophic interference rather than only single-task acquisition.
  source_experiment: EXP-GEN-0021
  proposed_hypothesis: H-LEARN-INTERF-001-A
  status: proposed
  created: '2026-09-05'
